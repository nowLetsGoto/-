openapi: 3.1.0
info:
  title: Dandelion 应用包分发 API
  version: 1.0.0
  description: >
    全仓唯一契约 SSOT。环境、平台、路径、请求体、响应体、错误码与常量只在此定义一次。
    前端由 openapi-typescript 生成 web/src/api/schema.d.ts（生成物入库）；
    后端 Go 常量由 server/internal/contract/contract_test.go 与本文逐项比对，漂移即测试失败。
    运行时不加载本文件。

servers:
  - url: /api/v1
    description: 业务接口统一前缀；/healthz 独立挂在根下，不受此前缀影响。

# 契约级常量：后端 contract_test.go 读取校验，前端不使用（生成物忽略 x- 扩展）。
x-constants:
  maxUploadMB: 300
  stageTokenTTLSeconds: 3600
  parseTimeoutSeconds: 20
  parseReadLimitMB: 5
  downloadButtonCooldownSeconds: 3
  authTokenTTLSeconds: 43200
  limits:
    appName: 100
    packageId: 100
    version: 50
    buildNumber: 50
    changelog: 2000
    username: 64
    password: 128
    webhookUrl: 500
    webhookSecret: 200
    projectKey: 32
    projectName: 60
    projectDescription: 200

# Webhook 可推送字段的唯一产品定义处：key 固定，value 是设置页展示的中文名。
# 后端 contract.WebhookFieldLabels 镜像本表，由契约测试逐项比对；前端标签从接口返回，不再抄一份。
x-webhook-fields:
  id: 包 ID
  appName: 应用名
  packageId: 包名 / Bundle ID
  version: 版本号
  buildNumber: 构建号
  environment: 环境
  platform: 平台
  changelog: 更新说明
  fileSize: 文件大小
  originalFileName: 原始文件名
  downloadPageUrl: 下载页地址
  downloadFileUrl: 下载文件地址
  downloadCount: 下载次数
  createdAt: 上传时间

# 展示标签的唯一产品维度定义处；前端 utils/format.ts 以 Record<契约类型, string> 镜像。
x-environments:
  test: 测试
  hotfix: 热更
  pre: 预发
  prd: 生产

# 平台元数据：扩展名、下载 Content-Type 全仓唯一定义处。
x-platforms:
  android:
    label: Android
    ext: apk
    contentType: application/vnd.android.package-archive
  ios:
    label: iOS
    ext: ipa
    contentType: application/octet-stream
  harmony:
    label: 鸿蒙
    ext: hap
    contentType: application/octet-stream

# 项目 key 的格式约束：只允许小写字母、数字与短横线，用于 URL 段。
x-project-key-pattern: '^[a-z0-9][a-z0-9-]{1,31}$'

x-page-routes:
  downloadPage: /d/{id}

paths:
  /projects:
    get:
      operationId: listProjects
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      summary: 项目列表
      description: >-
        返回范围由登录模式决定，不由参数决定：团队模式返回全量项目（项目切换器、
        项目守卫都用它）；单人模式只返回当前账号自己的项目——solo 分区的数据按人隔离，
        没有「看全部」这种可能。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 项目列表，按创建时间正序
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createProject
      summary: 新建项目
      description: key 只允许小写字母、数字与短横线，全仓唯一，创建后不可修改（它是 URL 段）。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /projects/{key}:
    get:
      operationId: getProject
      summary: 项目详情（含关联人员与团队的 ID）
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 项目详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: updateProject
      summary: 编辑项目（名称 / 描述 / 库地址；key 是 URL 段，不可修改）
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '200':
          description: 更新后的项目
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deleteProject
      summary: 删除项目
      description: >-
        只允许删除没有任何引用（应用包 / 成员 / 团队关联）的项目；有引用时返回 400 并说明剩余数量。
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          description: 项目 key（URL 段）
          schema:
            type: string
      responses:
        '200':
          description: 删除成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /people:
    get:
      operationId: listPeople
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      summary: 人员列表（含关联团队与项目 ID）
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 人员列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createPerson
      summary: 新增人员
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonInput'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /people/{id}:
    get:
      operationId: getPerson
      summary: 人员详情（含关联团队与项目 ID），编辑页回填用
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 人员详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updatePerson
      summary: 编辑人员（全量覆盖字段与关联）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonInput'
      responses:
        '200':
          description: 更新后的人员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deletePerson
      summary: 删除人员
      description: >-
        只允许删除没有任何引用（团队 / 项目 / 绑定账号）的人员；有引用时返回 400 并说明剩余数量。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 人员 id（UUID）
          schema:
            type: string
      responses:
        '200':
          description: 删除成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /teams:
    get:
      operationId: listTeams
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      summary: 团队列表（含关联人员与项目 ID）
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 团队列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createTeam
      summary: 新增团队
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamInput'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /teams/{id}:
    get:
      operationId: getTeam
      summary: 团队详情（含关联人员与项目 ID），编辑页回填用
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 团队详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateTeam
      summary: 编辑团队（全量覆盖字段与关联）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamInput'
      responses:
        '200':
          description: 更新后的团队
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deleteTeam
      summary: 删除团队
      description: >-
        只允许删除没有任何引用（成员 / 项目 / 管理员账号）的团队；有引用时返回 400 并说明剩余数量。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 团队 id（UUID）
          schema:
            type: string
      responses:
        '200':
          description: 删除成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /me:
    get:
      operationId: getMe
      summary: 当前登录人档案（含关联项目 key，用于列表页默认项目）
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 当前登录人
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/password:
    put:
      operationId: changeOwnPassword
      summary: 修改当前登录账号自己的密码（需校验旧密码，成功后旧令牌立即失效）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '200':
          description: 修改成功；旧令牌已失效，需重新登录
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /platform/tenants/{id}/status:
    post:
      operationId: setTenantStatus
      summary: 启用或停用公司（仅平台超级管理员）
      description: >-
        停用后该公司所有账号立即无法登录（登录时校验公司状态）。
        只改公司状态，不动其账号自身的启停状态，重新启用即可恢复。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 公司 id（UUID）
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, disabled]
      responses:
        '200':
          description: 更新后的公司
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非超级管理员

  /platform/tenants/{id}:
    delete:
      operationId: deleteTenant
      summary: 删除空公司（仅平台超级管理员）
      description: >-
        只允许删除没有任何业务数据的公司（人员 / 团队 / 项目 / 账号 / 自定义角色）。
        有数据时返回 400 并说明还剩什么，需先逐项清空。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 公司 id（UUID）
          schema:
            type: string
      responses:
        '200':
          description: 删除成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非超级管理员

  /platform/tenants:
    get:
      operationId: listTenants
      summary: 公司列表（仅平台超级管理员）
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: 公司列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非超级管理员
    post:
      operationId: createTenant
      summary: 新建公司及其平台管理员（仅平台超级管理员）
      description: 公司与平台管理员账号原子创建；响应里的 password 是该管理员的一次性明文密码
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantInput'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCreateResponse'
        '400':
          description: 参数不合法或名称/标识/账号名被占用
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非超级管理员

  /admin/users:
    get:
      operationId: listUsers
      summary: 账号列表（团队管理员及以上；范围由身份层级决定）
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: keyword
          in: query
          required: false
          description: 同时匹配登录名与绑定人员姓名
          schema:
            type: string
      responses:
        '200':
          description: 账号列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非超级管理员
    post:
      operationId: createUser
      summary: 新建账号（仅超级管理员）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非超级管理员

  /admin/users/{id}:
    get:
      operationId: getUser
      summary: 账号详情（仅超级管理员；供编辑页回填）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 账号详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非超级管理员
        '404':
          description: 账号不存在，或不属于当前登录模式
    put:
      operationId: updateUser
      summary: 改绑定人员、角色与超管标记（登录名与模式不可改）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: 更新后的账号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非超级管理员
    delete:
      operationId: deleteUser
      summary: 删除账号（不可恢复；不能删自己，也不能删掉最后一个可用超管）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 被删除的账号（前端据此提示"已删除 xxx"）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非超级管理员
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/users/{id}/reset-password:
    post:
      operationId: resetUserPassword
      summary: 重置密码，返回一次性临时密码
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 临时密码（只出现这一次）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非超级管理员
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/users/{id}/status:
    post:
      operationId: setUserStatus
      summary: 启用 / 禁用账号（禁用会立即让该账号的令牌失效）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserStatusInput'
      responses:
        '200':
          description: 更新后的账号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非超级管理员

  /admin/audit-logs:
    get:
      operationId: listAuditLogs
      summary: 审计日志（平台管理员及以上，只读）
      description: >-
        可见范围由服务端按身份收敛：平台管理员只看本公司，超级管理员看全部公司。
        仅团队模式下可用——单人分区的审计不带公司过滤，允许单人视图查询会跨公司泄漏。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: action
          in: query
          required: false
          description: 动作模糊匹配，如 user.disabled
          schema:
            type: string
        - name: actor
          in: query
          required: false
          description: 操作者账号模糊匹配
          schema:
            type: string
        - name: result
          in: query
          required: false
          schema:
            type: string
            enum: [success, failure]
      responses:
        '200':
          description: 审计日志列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非超级管理员

  /menus:
    get:
      operationId: listMenus
      summary: 菜单资源目录（平台级只读）
      description: >-
        返回系统全部可授权菜单，按 group 分组。菜单结构由代码定义，任何公司都不能增删改。
        角色授权只做减法：菜单可见 = 原有身份/权限判据 ∩ 角色授权菜单；超管不受约束。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 菜单目录
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Menu'

  /permissions:
    get:
      operationId: listPermissions
      summary: 权限点目录（仅超级管理员；前端据此渲染勾选矩阵，避免把目录抄进前端）
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 权限点列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非超级管理员

  /roles:
    get:
      operationId: listRoles
      summary: 角色列表（平台管理员起可读；含各自权限点，非超管看不到 super-admin）
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 角色列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非超级管理员
    post:
      operationId: createRole
      summary: 新建自定义角色（仅超级管理员）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非超级管理员

  /roles/{id}:
    get:
      operationId: getRole
      summary: 角色详情
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 角色 id（全局唯一；key 只保证公司内唯一，超管视角下会歧义）
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 角色详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 缺少 role.read / role.write 权限
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateRole
      summary: 编辑角色名称 / 描述 / 权限与菜单授权
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 角色 id（全局唯一；key 只保证公司内唯一，超管视角下会歧义）
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
      responses:
        '200':
          description: 更新后的角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 缺少 role.read / role.write 权限
    delete:
      operationId: deleteRole
      summary: 删除角色
      description: >-
        只允许删除本公司自定义角色，且该角色未被任何人员或项目使用。平台内置角色与超管角色不可删除。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 角色 id
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 删除成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /storage/usage:
    get:
      operationId: getStorageUsage
      summary: 当前租户的对象存储用量
      description: >
        返回已用容量、配额余量、按项目/环境/平台的分组明细，以及待同步与同步失败的数量。
        租户由登录态决定，不接受请求参数——否则等于允许越权查别家公司的用量。
        所有派生量（剩余额度、可上传数量）由服务端算好，前端只展示，
        避免两处各实现一遍配额口径而产生漂移。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 用量统计
          content:
            application/json:
              schema:
                type: object
                required: [code, data]
                properties:
                  code:
                    type: integer
                  data:
                    $ref: '#/components/schemas/StorageUsage'

  /settings:
    get:
      operationId: getSettings
      summary: 读取本公司系统设置（Webhook 配置 + 外部 API Key）
      description: 平台管理员取本公司配置；超级管理员取平台兜底配置。归属由登录身份推导，不接受请求参数。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 当前设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateSettings
      summary: 更新 Webhook 配置
      description: 只更新 Webhook 部分；API Key 由服务端生成，不在此接口修改。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookConfig'
      responses:
        '200':
          description: 更新后的完整设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /settings/webhook/test:
    post:
      operationId: testWebhook
      summary: 向当前 Webhook 地址发一条示例消息
      description: >
        使用已保存的配置同步投递测试消息，飞书测试卡片明确标为测试且不提供虚假下载按钮。
        飞书投递必须同时满足 HTTP 2xx 与响应 code=0；业务错误也返回 delivered=false。
        目标不可达不算接口错误：仍返回 200，由 delivered/statusCode/message 表达结果。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 投递结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookTestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /settings/api-key/rotate:
    post:
      operationId: rotateApiKey
      summary: 轮换外部接口 API Key（仅超级管理员，旧 Key 立即失效）
      description: 新 Key 只在本次响应里出现一次，请立即保存到外部系统。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 新的 API Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyResultResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非平台管理员及以上

  /open/builds:
    post:
      operationId: openUploadBuild
      summary: 外部系统一步式上传安装包（CI / 脚本调用）
      description: >
        一步式 multipart，一次请求完成「写入暂存 + 解析 + 落盘 + 写库 + 生成地址」。
        鉴权用 X-API-Key（在系统设置页获取），不依赖管理员登录态。
        文本字段可省略：省略时用解析出的包信息补齐，再缺才用文件名兜底。
        大包请改用 /open/builds/upload-ticket → PUT putUrl → /open/builds/stage-from-r2，
        字节直传 R2，不受 Tunnel 请求体上限约束；两步链路与本接口共用同一套发布逻辑。
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, project, environment, platform]
              properties:
                file:
                  type: string
                  format: binary
                  description: .apk / .ipa / .hap，单包上限 300 MB
                project:
                  type: string
                  description: 项目 key
                environment:
                  $ref: '#/components/schemas/Environment'
                platform:
                  $ref: '#/components/schemas/Platform'
                appName:
                  type: string
                  maxLength: 100
                packageId:
                  type: string
                  maxLength: 100
                version:
                  type: string
                  maxLength: 50
                buildNumber:
                  type: string
                  maxLength: 50
                changelog:
                  type: string
                  maxLength: 2000
      responses:
        '201':
          description: 上传成功，返回完整 Build（含下载页与下载文件绝对地址）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /open/builds/upload-ticket:
    post:
      operationId: openUploadTicket
      summary: 外部系统直传 R2 第一步：签发预签名 PUT 票据
      description: >
        大包走三步直传，字节直接从调用方传到 R2，绕过 Cloudflare Tunnel 的 100 MB 请求体上限。
        本步只传文件元信息，服务端校验项目归属并签发票据；PUT 时须原样带上返回的 header，
        Content-Length 由客户端按文件大小自动发送。票据有效期 1 小时。
        一步式 multipart 的 /open/builds 仍保留给小包。
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadTicketInput'
      responses:
        '200':
          description: 票据签发成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/UploadTicket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /open/builds/stage-from-r2:
    post:
      operationId: openStageFromR2
      summary: 外部系统直传 R2 第三步：提交元信息并发布
      description: >
        调用方 PUT 完成后，用 uploadToken 调本接口。服务端校验对象存在且大小一致，
        解析包元信息并写库，返回与页面上传完全一致的 Build。
        包发布后后台会异步把对象拉回本机留底，进度与页面上传共用同一套字段。
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenStageFromR2Input'
      responses:
        '201':
          description: 发布成功，返回完整 Build
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      operationId: login
      summary: 管理员登录，换取访问令牌
      description: >
        单管理员账号模型：凭据由部署配置（ADMIN_USERNAME / ADMIN_PASSWORD）提供，不落库。
        成功返回无状态 HMAC 令牌（到期时间戳 + 签名），服务端不存会话；
        前端以 Authorization: Bearer <token> 访问受保护接口。
        凭据错误返回 400（与全站错误码口径一致）；401 专用于「未携带令牌或令牌失效」。
        同一「账号 + 来源 IP」连续失败 5 次后锁定 15 分钟，期间一律返回 429。
        不存在的账号同样计数，因此 429 不构成「账号是否存在」的信息泄露。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功，返回令牌与到期时间
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          description: 登录失败次数超限，临时锁定（同一账号 + IP 连续失败 5 次后锁定 15 分钟）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'

  /builds/stage:
    post:
      operationId: stageBuild
      summary: 暂存安装包并同步解析元数据
      description: >
        选文件时自动触发，对用户透明，不是两步发布。文件只上传这一次；
        服务端写入 storage/tmp/{stageToken}.{origExt} 后同步解析，
        解析失败、包损坏、超时只写入 warnings，接口恒返回 200。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 仅接受 .apk / .ipa，单包上限 300 MB
      responses:
        '200':
          description: 暂存成功（解析成败都成功）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /builds/upload-ticket:
    post:
      operationId: issueUploadTicket
      summary: 申请浏览器直传 R2 的预签名票据
      description: >
        用于超过 Cloudflare Tunnel 100 MB 请求体上限的大包。
        返回预签名 PUT 地址与必需请求头，浏览器直接 PUT 到 R2，字节不经过本机；
        上传成功后调 /builds/stage-from-r2 回拉并解析，再走原有 commit。
        未启用 R2 时返回 400，前端应回落到 /builds/stage。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadTicketInput'
      responses:
        '200':
          description: 票据签发成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/UploadTicket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /builds/stage-from-r2:
    post:
      operationId: stageFromR2
      summary: 回拉已直传到 R2 的对象并解析元信息
      description: >
        校验会话有效性、对象存在性与实际大小后，把对象读回本地暂存目录，
        产出与 /builds/stage 完全一致的 StageResult（含 stageToken 与解析结果）。
        大小不一致、对象缺失、会话过期都返回 400，前端应提示重新上传。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uploadToken]
              properties:
                uploadToken:
                  type: string
      responses:
        '200':
          description: 回拉并解析完成（解析成败都成功）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /builds/upload-abort:
    post:
      operationId: abortUpload
      summary: 放弃直传并清理 R2 临时对象
      description: >
        前端在改选文件、关闭页面或 PUT 失败时调用。不调用也会由会话过期清理兜底，
        因此该接口失败不影响后续上传。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uploadToken]
              properties:
                uploadToken:
                  type: string
      responses:
        '200':
          description: 已清理
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /builds:
    post:
      operationId: commitBuild
      summary: 提交发布 commit（只发 token 与表单最终值，不携带文件、不再解析）
      description: >
        服务端校验 stageToken 后把暂存文件 rename 到正式目录、写库、生成三个 URL。
        表单即最终真值：不使用解析结果覆盖用户值，仅对空字段做文件名/占位值兜底。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitBuildRequest'
      responses:
        '201':
          description: 发布成功，返回完整 Build
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listBuilds
      summary: 按项目 + 环境（+平台）查询包列表，时间倒序，不分页
      security:
        - bearerAuth: []
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
          description: 项目 key；不同项目的包互不可见
        - name: environment
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/EnvironmentQuery'
        - name: platform
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PlatformQuery'
      responses:
        '200':
          description: "成功；空结果为 items: [] 而非 404"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBuildsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /builds/{id}:
    put:
      security:
        - bearerAuth: []
      operationId: updateBuild
      summary: 编辑应用包展示信息（按真实项目校验 build.write）
      description: 仅修改名称、版本、构建号、环境与更新说明；安装文件、平台、包名及分享凭证保持不变。
      parameters:
        - $ref: '#/components/parameters/BuildId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBuildRequest'
      responses:
        '200':
          description: 编辑成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      security:
        - bearerAuth: []
      operationId: deleteBuild
      summary: 删除应用包（按真实项目校验 build.delete）
      description: 删除包记录及关联分享授权后清理安装文件；下载页与已有分享链接随之失效，其他版本不受影响。
      parameters:
        - $ref: '#/components/parameters/BuildId'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      security:
        - bearerAuth: []
      operationId: getBuild
      summary: 登录用户的下载页预览详情（按真实项目校验权限）
      parameters:
        - $ref: '#/components/parameters/BuildId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /builds/{id}/versions:
    get:
      security:
        - bearerAuth: []
      operationId: getBuildVersions
      summary: 登录用户可访问的同应用版本与平台包
      description: >
        按目标包定位分区与项目，返回同项目、同 appName、同 packageId、同平台、同上传者的其它包，
        跨环境按上传时间倒序返回完整版本列表，供有项目读取权限的登录用户切换环境和选择历史版本。
        includePlatforms=true 时同时返回其它平台的包；跨平台以同项目、同 appName、同上传者关联，
        允许 Android 包名与 iOS Bundle ID 不同，同平台仍按 packageId 收敛。
        字段经白名单收敛，不含相对路径、上传者或原始文件名。
      parameters:
        - $ref: '#/components/parameters/BuildId'
        - name: includePlatforms
          in: query
          description: 是否包含同应用其它平台的安装包，用于下载页切换安装平台
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicBuildVersionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /builds/{id}/local-pull:
    post:
      operationId: retryLocalPull
      summary: 重新把包从对象存储下载到本机
      description: >
        与 sync-to-r2 方向相反：那个把本机副本推上云端，这个把云端对象拉回本机。
        
        用于失败后的主动重试。自动重试要等下一轮巡检（最长 2 小时），
        管理员看到红色失败提示时，若只能干等，这个提示就成了信息死路。
        
        异步执行：整包可能上百 MB，同步等待会被 Cloudflare 的 100 秒代理超时切断。
        响应立刻返回已置为重新排队的包，前端后续轮询 localPulledBytes 看进度。
        
        不可重试的情况：对象不在桶里（非 synced）、本机已有副本、正在下载中。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 已受理并重新排队
          content:
            application/json:
              schema:
                type: object
                required: [code, data]
                properties:
                  code:
                    type: integer
                  data:
                    $ref: '#/components/schemas/Build'
        '400':
          description: 状态不允许重试（不在 R2 / 已有副本 / 正在下载）
        '404':
          description: 包不存在或无权访问

  /builds/{id}/sync-to-r2:
    post:
      operationId: syncBuildToR2
      summary: 把已被容量淘汰的包重新推回对象存储
      description: >
        本机是权威副本、R2 是可回收的缓存。包被容量淘汰后对象已离开桶，
        下载会回落到本机流式（较慢）。调用本接口可用本机副本重建 R2 对象，
        恢复 CDN 直链下载。
        
        限定行为：仅允许 r2State=evicted 的包重推。synced 说明对象还在桶里，
        重推纯属浪费带宽；pending 是上传流程的中间态，不该由这个入口介入。
        已同步或已在后台同步时幂等受理，不报错——用户可能连点两次或页面状态过期。

        返回 202 表示已受理，上传在后台进行；前端轮询 /builds/{id}/sync-progress
        直到 state 变为 succeeded / failed。这样整包上传不会撞上 Cloudflare 的
        100 秒代理超时。

        同步失败条件（当场返回 400）：本机副本已丢失（本接口不做拉回，
        没有别的字节来源）、记录缺少 r2Key（无法确定推到哪个对象名）。
        后台上传失败只记日志，r2State 保持 evicted，可再次调用重试。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 包 id
      responses:
        '202':
          description: 已受理，后台上传中（或本来已同步）
          content:
            application/json:
              schema:
                type: object
                required: [code, data]
                properties:
                  code:
                    type: integer
                  data:
                    $ref: '#/components/schemas/Build'
        '404':
          description: 包不存在或无权访问
        '400':
          description: 状态不允许重推，或本机副本已丢失

  /builds/{id}/sync-progress:
    get:
      operationId: getSyncProgress
      summary: 查询一次「同步到 R2」的实时进度
      description: >
        重推是后台任务，本接口返回当前进度快照。state 为 running 时 bytes 持续增长；
        终态保留 10 分钟后回落到 idle。前端据此在包卡片标题下画进度条：
        失败红色、成功绿色。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 包 id
      responses:
        '200':
          description: 进度快照
          content:
            application/json:
              schema:
                type: object
                required: [code, data]
                properties:
                  code:
                    type: integer
                  data:
                    $ref: '#/components/schemas/SyncProgress'
        '404':
          description: 包不存在或无权访问

  /builds/{id}/file:
    get:
      security:
        - bearerAuth: []
      operationId: downloadBuildFile
      summary: 下载原始包文件（唯一不套 JSON 的成功响应）
      description: >
        io.Copy 成功完成且写出字节等于 Content-Length 之后才原子 +1 下载次数；
        404、路径非法、文件缺失、客户端中断、copy 出错、字节不足一律不计数。
      parameters:
        - $ref: '#/components/parameters/BuildId'
      responses:
        '200':
          description: 二进制包流
          headers:
            Content-Type:
              schema:
                type: string
              description: Android 为 application/vnd.android.package-archive，iOS 为 application/octet-stream
            Content-Disposition:
              schema:
                type: string
              description: 同时提供 filename 与 RFC 5987 filename*=UTF-8''... 双重编码
            Content-Length:
              schema:
                type: integer
            Cache-Control:
              schema:
                type: string
              example: private, no-store
            X-Content-Type-Options:
              schema:
                type: string
              example: nosniff
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /public/builds/{id}:
    get:
      operationId: getSharedBuild
      summary: 免登录查看分享绑定的单个版本
      description: >
        每次验证分享凭证，不使用或继承访问者登录态。不返回内部路径、上传者或原始文件名。
        同应用的环境、平台及历史版本通过 /public/builds/{id}/versions 获取。
        缺失、篡改、跨包、过期和撤销的凭证统一返回 404，响应禁止缓存。
      security:
        - shareHeader: []
        - shareQuery: []
      parameters:
        - $ref: '#/components/parameters/BuildId'
      responses:
        '200':
          description: 分享版本白名单详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedBuildResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /public/builds/{id}/versions:
    get:
      operationId: getSharedBuildVersions
      summary: 凭分享授权查看同应用的环境、平台及历史版本
      description: >
        每次先验证来源包的分享凭证，分区由已验证的凭证固定，不继承访问者登录态。
        返回同项目、同 appName、同上传者的其它包；同平台按 packageId 收敛，跨平台允许不同包名。
        仅返回已有且有效的分享授权，不创建或恢复已撤销、过期的授权。
        每个目标版本携带自己的 downloadPageUrl，切换后详情和文件仍逐次验证目标包凭证。
        不返回内部路径、上传者、原始文件名或项目 key；缺失或无效来源凭证统一返回 404，禁止缓存。
      security:
        - shareHeader: []
        - shareQuery: []
      parameters:
        - $ref: '#/components/parameters/BuildId'
      responses:
        '200':
          description: 可用分享版本的白名单列表，按发布时间倒序
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicBuildVersionsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /public/builds/{id}/file:
    get:
      security:
        - shareHeader: []
        - shareQuery: []
      operationId: downloadSharedBuildFile
      summary: 免登录下载分享绑定的单个安装包
      description: >
        每次验证分享签名、分区、包 ID、有效期和撤销状态；缺失或无效凭证统一返回 404。
        浏览器直接下载使用 shareToken 查询参数，禁止用登录令牌或 API Key 替代。
        io.Copy 成功完成且写出字节等于 Content-Length 之后才原子 +1 下载次数；
        404、路径非法、文件缺失、客户端中断、copy 出错、字节不足一律不计数。
      parameters:
        - $ref: '#/components/parameters/BuildId'
      responses:
        '200':
          description: 二进制包流
          headers:
            Content-Type:
              schema:
                type: string
              description: Android 为 application/vnd.android.package-archive，iOS 为 application/octet-stream
            Content-Disposition:
              schema:
                type: string
              description: 同时提供 filename 与 RFC 5987 filename*=UTF-8''... 双重编码
            Content-Length:
              schema:
                type: integer
            Cache-Control:
              schema:
                type: string
              example: private, no-store
            X-Content-Type-Options:
              schema:
                type: string
              example: nosniff
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /public/builds/{id}/download-count:
    post:
      operationId: recordSharedDownload
      summary: 给走 CDN 直链的分享下载补记一次计数
      description: >
        当分享页链接直接指向 R2 CDN 时，浏览器不再请求本站文件接口，
        原本在那里的下载计数会丢失。前端点击直链时调用本接口补记。
        仍须验证分享签名；计数失败不影响用户已经开始的下载。
      security:
        - shareHeader: []
        - shareQuery: []
      parameters:
        - $ref: '#/components/parameters/BuildId'
      responses:
        '200':
          description: 已记录
        '404':
          $ref: '#/components/responses/NotFound'

  /healthz:
    get:
      operationId: health
      summary: 健康检查（独立于 /api/v1，供 compose/systemd 探活）
      description: 该路径挂在根下， servers.url 前缀对它不生效。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        登录接口返回的 token。管理接口和内部下载预览要求携带 Authorization: Bearer <token>；
        免登录分享使用独立的 shareHeader/shareQuery，不能互相替代。
    shareHeader:
      type: apiKey
      in: header
      name: X-Share-Token
      description: 用途独立、绑定分区与单个版本的分享凭证；页面取数推荐放请求头。
    shareQuery:
      type: apiKey
      in: query
      name: shareToken
      description: 同一分享凭证的 URL 形式，供分享页和浏览器原生流式下载；不要记录到代理访问日志。
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        外部系统专用。Key 在「系统设置 → 外部 API」查看，由服务端生成，
        与管理员登录态互不影响，只授权 /open/builds。

  parameters:
    PageParam:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始；缺省或非法按 1 处理
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: pageSize
      in: query
      required: false
      description: 每页条数，默认 10、上限 200；显式传 0 表示不分页（返回全量，供下拉选项与聚合使用）
      schema:
        type: integer
        minimum: 0
        maximum: 200
        default: 10
    BuildId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: 包稳定唯一标识

  responses:
    BadRequest:
      description: 缺文件 / 枚举非法 / 平台与文件类型不一致 / 字段超长 / stageToken 失效 / 登录凭据错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 未携带令牌、签名非法或令牌已过期；前端据此清空本地会话并回到登录页
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 已登录但无权执行该操作（身份层级或角色权限不足）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 请求的资源不存在或已被移除
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: 请求方法不支持
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooLarge:
      description: 超过 300 MB 单包上限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: 写文件 / 写库 / 未预期错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    WebhookField:
      type: string
      description: 可推送到 Webhook 的包字段；展示名见 x-webhook-fields
      enum:
        [id, appName, packageId, version, buildNumber, environment, platform,
         changelog, fileSize, originalFileName, downloadPageUrl, downloadFileUrl,
         downloadCount, createdAt]

    WebhookProvider:
      type: string
      description: 通用 JSON Webhook 或飞书自定义机器人；存量配置默认 generic。
      enum: [generic, feishu]
      default: generic

    WebhookConfig:
      type: object
      description: >
        Webhook 配置。enabled=true 时 url 必填且必须是 http(s) 绝对地址；
        provider 省略时按 generic 处理。generic 的 secret 用于请求头 X-Dandelion-Signature；
        feishu 的 secret 为飞书机器人签名密钥，用于请求体 timestamp/sign。
        飞书地址须为官方 HTTPS 自定义机器人地址，fields 必须包含 downloadPageUrl。
      additionalProperties: false
      required: [enabled, url, secret, fields]
      properties:
        provider:
          $ref: '#/components/schemas/WebhookProvider'
        enabled:
          type: boolean
        url:
          type: string
          maxLength: 500
        secret:
          type: string
          maxLength: 200
        fields:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WebhookField'

    WebhookFieldOption:
      type: object
      description: 设置页渲染复选框用的字段目录，标签由服务端给出，前端不再抄一份
      required: [key, label]
      properties:
        key:
          $ref: '#/components/schemas/WebhookField'
        label:
          type: string

    Settings:
      type: object
      required: [webhook, apiKeyConfigured, availableFields]
      properties:
        webhook:
          $ref: '#/components/schemas/WebhookConfig'
        apiKeyConfigured:
          type: boolean
          description: >-
            是否已生成过外部上传接口的 Key。Key 本身只存 SHA-256 摘要，
            本接口不返回明文；要拿明文请调用轮换接口（一次性返回）。
        availableFields:
          type: array
          items:
            $ref: '#/components/schemas/WebhookFieldOption'

    WebhookTestResult:
      type: object
      description: 测试投递结果；目标不可达也是 200，用 delivered=false 表达
      required: [delivered, statusCode, message]
      properties:
        delivered:
          type: boolean
        statusCode:
          type: integer
          description: 目标返回的 HTTP 状态码；未收到响应时为 0
        message:
          type: string

    LoginRequest:
      type: object
      description: 管理员登录请求；mode 省略时按单人模式处理。
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          maxLength: 128
        mode:
          $ref: '#/components/schemas/SessionMode' 

    SessionMode:
      type: string
      description: 登录模式；solo 单人只看自己产生的数据，team 团队看全量平台数据
      enum: [solo, team]
      default: solo

    AccountLevel:
      type: string
      description: >
        管理身份层级，决定「能管谁、管多大范围」，与业务角色正交。
        顺序 super_admin > platform_admin > team_admin > member；
        与 users.account_level 的 CHECK 约束、Go 的 contract.AccountLevel* 常量一一对应。
      enum: [super_admin, platform_admin, team_admin, member]
      default: member

    LoginResult:
      type: object
      description: >
        无状态令牌：载荷含账号、令牌版本、到期时间与登录模式，签名由 AUTH_SECRET 生成。
        服务端不存会话，重启后令牌仍然有效；前端存 localStorage 并随请求发送。
      required: [token, username, expiresAt, mode, accountLevel, tenantId]
      properties:
        token:
          type: string
          description: 形如「账号|版本|到期时间戳|模式.HMAC-SHA256 签名」的 BASE64URL 串
        username:
          type: string
        expiresAt:
          type: string
          format: date-time
          description: ISO 8601 UTC，由 x-constants.authTokenTTLSeconds 推出
        mode:
          $ref: '#/components/schemas/SessionMode'
        accountLevel:
          $ref: '#/components/schemas/AccountLevel'
        tenantId:
          type: string
          description: 账号所属公司 id；超管为空串。仅供首屏展示，服务端判定一律以令牌重建的身份为准

    Environment:
      type: string
      description: 四环境枚举，全仓唯一定义处；DB 只 NOT NULL 不加 CHECK
      enum: [test, hotfix, pre, prd]

    Platform:
      type: string
      description: 平台枚举；label / ext / contentType 见 x-platforms
      enum: [android, ios, harmony]

    EnvironmentQuery:
      type: string
      description: 环境筛选，all 表示全部环境
      enum: [all, test, hotfix, pre, prd]

    PlatformQuery:
      type: string
      description: 平台筛选，省略或 all 表示不筛
      enum: [all, android, ios, harmony]

    Project:
      type: object
      description: 项目是业务数据的一级归属：应用包、应用、热更新都挂在项目下
      required: [id, key, name, description, repoUrl, iconUrl, roleKey, roleName, createdAt]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          description: URL 段，创建后不可修改
        name:
          type: string
        description:
          type: string
        repoUrl:
          type: string
          description: 项目库地址（GitLab / GitHub 等），空串表示未填；详情页渲染为可点击链接
        iconUrl:
          type: string
          description: 项目图标 data URL；空串表示未上传，列表回退首字母占位
        roleKey:
          type: string
          description: 项目角色标识；为空表示沿用人员自身角色
        roleName:
          type: string
        createdAt:
          type: string
          format: date-time

    ProjectInput:
      type: object
      description: 新建 / 编辑项目请求；编辑时 key 被忽略
      additionalProperties: false
      required: [key, name, description, repoUrl, roleKey]
      properties:
        key:
          type: string
          maxLength: 32
          pattern: '^[a-z0-9][a-z0-9-]{1,31}$'
          description: 小写字母 / 数字 / 短横线，2-32 位，全仓唯一
        name:
          type: string
          maxLength: 60
        description:
          type: string
          maxLength: 200
        repoUrl:
          type: string
          maxLength: 300
          description: http(s) 绝对地址；留空表示未填
        iconUrl:
          type: string
          maxLength: 700000
          description: 项目图标 data URL（png/jpg/webp，≤512KB）；留空表示不上传
        roleKey:
          type: string
          description: 项目角色标识；留空表示沿用人员自身角色

    ProjectDetail:
      type: object
      description: 项目详情 = 项目本身 + 关联的人员与团队（带名字）
      required: [id, key, name, description, repoUrl, iconUrl, roleKey, roleName, createdAt, persons, teams]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        description:
          type: string
        repoUrl:
          type: string
        iconUrl:
          type: string
        roleKey:
          type: string
        roleName:
          type: string
        createdAt:
          type: string
          format: date-time
        persons:
          type: array
          items:
            $ref: '#/components/schemas/RelationRef'
        teams:
          type: array
          items:
            $ref: '#/components/schemas/RelationRef'

    RelationRef:
      type: object
      description: 关联的轻量投影（id + 名字）；列表接口直接带回，前端不必再拉对方列表
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string

    Person:
      type: object
      description: 人员；teams / projects 是带名字的多选关联
      required: [id, name, email, phone, title, roleKey, roleName, teams, projects, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        username:
          type: string
          description: 与登录账号对应；空表示只在通讯录里，不能登录
        email:
          type: string
        phone:
          type: string
        title:
          type: string
        roleKey:
          type: string
          description: 该人员的角色标识；空表示未分配
        roleName:
          type: string
        teams:
          type: array
          items:
            $ref: '#/components/schemas/RelationRef'
        projects:
          type: array
          items:
            $ref: '#/components/schemas/RelationRef'
        createdAt:
          type: string
          format: date-time

    PersonInput:
      type: object
      description: 新增 / 编辑人员请求
      additionalProperties: false
      required: [name, username, email, phone, title, roleKey, teamIds, projectIds]
      properties:
        name:
          type: string
          maxLength: 40
        username:
          type: string
          maxLength: 64
        email:
          type: string
          maxLength: 120
        phone:
          type: string
          maxLength: 40
        title:
          type: string
          maxLength: 60
        roleKey:
          type: string
          description: 角色标识；留空表示未分配
        teamIds:
          type: array
          items:
            type: string
        projectIds:
          type: array
          items:
            type: string

    Team:
      type: object
      description: 团队；persons / projects 是带名字的多选关联
      required: [id, name, description, persons, projects, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        persons:
          type: array
          items:
            $ref: '#/components/schemas/RelationRef'
        projects:
          type: array
          items:
            $ref: '#/components/schemas/RelationRef'
        createdAt:
          type: string
          format: date-time

    TeamInput:
      type: object
      description: 新增 / 编辑团队请求
      additionalProperties: false
      required: [name, description, personIds, projectIds]
      properties:
        name:
          type: string
          maxLength: 60
        description:
          type: string
          maxLength: 200
        personIds:
          type: array
          items:
            type: string
        projectIds:
          type: array
          items:
            type: string

    Me:
      type: object
      description: 当前登录人；没有对应人员记录时 personId 为空、projectKeys 为空
      required: [username, personId, name, roleKey, roleName, projectKeys, isSuperAdmin, tenantId, tenantName, accountLevel, teamIds, permissions, menuKeys]
      properties:
        username:
          type: string
        personId:
          type: string
        name:
          type: string
        roleKey:
          type: string
          description: 人员在团队里的角色 key；未分配角色时为空串
        roleName:
          type: string
          description: 角色名；为空表示该人员没有角色，前端统一显示「普通用户」
        projectKeys:
          type: array
          description: 该人员关联的项目 key，按项目创建顺序；前端据此决定列表页默认项目
          items:
            type: string
        isSuperAdmin:
          type: boolean
          description: 是否超级管理员；前端据此决定是否渲染「超级管理员」菜单（真正的边界在服务端 403）
        tenantId:
          type: string
          description: 账号所属公司 id；超管为空串
        tenantName:
          type: string
          description: 公司名，由 tenants 表按 tenantId 查得；超管为空串
        accountLevel:
          $ref: '#/components/schemas/AccountLevel'
        teamIds:
          type: array
          description: 数据范围内的团队 id 并集，由 authz.Service.ScopeOf 推导；超管与公司管理员为空数组表示不限团队
          items:
            type: string
            format: uuid
        permissions:
          type: array
          description: 平台级权限点（不含项目）；项目内权限可能被项目角色覆盖，由各接口判定
          items:
            type: string
        menuKeys:
          type: array
          description: >-
            当前角色被授权可见的菜单 key，供前端收窄侧栏。不是判定依据，真正边界在后端守卫。
            超管拿到全部菜单；未分配角色时为空数组。
          items:
            type: string

    User:
      type: object
      description: 账号视图（不含任何密码字段）
      required: [id, username, mode, personId, personName, roleKey, roleName, isSuperAdmin, status, lastLoginAt, lastLoginIp, createdAt, accountLevel, tenantId, teamIds]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        mode:
          $ref: '#/components/schemas/SessionMode'
        personId:
          type: string
          description: 绑定的人员档案 id，空表示未绑定
        personName:
          type: string
        roleKey:
          type: string
          description: 绑定人员的角色 key；账号本身没有角色，角色挂在人员身上
        roleName:
          type: string
          description: 角色名；为空表示未分配角色，前端显示「普通用户」
        isSuperAdmin:
          type: boolean
        status:
          type: string
          enum: [active, disabled]
        lastLoginAt:
          type: string
          format: date-time
        lastLoginIp:
          type: string
        createdAt:
          type: string
          format: date-time
        accountLevel:
          $ref: '#/components/schemas/AccountLevel'
          description: 管理身份层级，与业务角色正交
        tenantId:
          type: string
          description: 账号归属公司；超管为空
        teamIds:
          type: array
          description: 团队管理员可管的团队 id；其它层级为空数组
          items:
            type: string

    UserInput:
      type: object
      description: >-
        新建账号。没有 mode 字段：账号归属模式由创建者的登录模式决定，
        登录时已选定模式，页面上只做只读展示。
        accountLevel 只能传比调用者低的层级，越权由服务端拒绝；归属公司从调用者推导，不接受请求指定。
      additionalProperties: false
      required: [username, password, personId, isSuperAdmin, accountLevel, teamIds]
      properties:
        username:
          type: string
          maxLength: 32
          pattern: '^[a-zA-Z0-9._-]{3,32}$'
        password:
          type: string
          minLength: 8
          maxLength: 64
        personId:
          type: string
          description: >-
            绑定的人员档案 id；留空会建出一个没有角色、登录后也拿不到业务权限的账号，
            因此平台管理员与团队管理员创建时必填（超管可先建号、之后再绑）。
        roleKey:
          type: string
          description: >-
            随绑定人员一起写入的角色标识（写的是 people.role_key，users 表没有角色列）。
            留空表示沿用该人员现有角色；非空时服务端校验调用者能否分配该角色——
            非超管分配 super-admin 一律拒绝。
        isSuperAdmin:
          type: boolean
        accountLevel:
          $ref: '#/components/schemas/AccountLevel'
        teamIds:
          type: array
          description: 仅 accountLevel=team_admin 时有意义，且必须落在调用者可见的团队内
          items:
            type: string

    UserUpdate:
      type: object
      description: >-
        编辑账号（登录名与模式都不可改）。roleKey 写的是绑定人员的角色（people.role_key），
        因此「在这里改角色」与「在人员管理里改角色」是同一件事。
      additionalProperties: false
      required: [personId, roleKey, isSuperAdmin]
      properties:
        personId:
          type: string
          description: 绑定的人员档案 id；为空时 roleKey 会被忽略（角色必须挂在人身上）
        roleKey:
          type: string
          description: 绑定人员的角色 key；空串表示不分配角色
        isSuperAdmin:
          type: boolean

    TenantInput:
      type: object
      description: 新建公司及其平台管理员；两者原子创建，明文密码只在响应里返回一次
      additionalProperties: false
      required: [name, code, adminUsername, adminPassword]
      properties:
        name:
          type: string
          description: 公司名称
        code:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,31}$'
          description: 公司标识，小写字母/数字/短横线
        adminUsername:
          type: string
          pattern: '^[a-zA-Z0-9._-]{3,32}$'
          description: 平台管理员账号名
        adminPassword:
          type: string
          minLength: 8
          maxLength: 64
          description: 平台管理员初始密码

    Tenant:
      type: object
      description: 公司视图（含其平台管理员账号名）
      required: [id, name, code, status, adminUsername, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
        status:
          type: string
          enum: [active, disabled]
        adminUsername:
          type: string
        createdAt:
          type: string
          format: date-time

    TenantResult:
      type: object
      description: 新建公司的结果；password 是平台管理员的一次性明文密码
      required: [tenant, password]
      properties:
        tenant:
          $ref: '#/components/schemas/Tenant'
        password:
          type: string

    TenantListResponse:
      type: object
      description: 统一响应外壳，data 为公司分页列表
      required: [code, data, message]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: object
          required: [items, page, pageSize, total]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Tenant'
            page:
              type: integer
            pageSize:
              type: integer
            total:
              type: integer

    TenantCreateResponse:
      type: object
      description: 统一响应外壳，data 为新建公司结果
      required: [code, data, message]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/TenantResult'

    TenantResponse:
      type: object
      description: 统一响应外壳，data 为单个公司
      required: [code, data, message]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/Tenant'

    Menu:
      type: object
      description: 平台级菜单资源，路径即 key；自带查看权限与操作权限，构成完整的授权树节点
      required: [key, label, group, viewPermission, actions]
      properties:
        key:
          type: string
          description: 页面路径，如 /overview、/directory/roles
        label:
          type: string
          description: 上屏名称
        group:
          type: string
          description: 一级分组名，用于渲染授权树
        viewPermission:
          type: string
          description: 勾选本菜单即自动授予的查看权限，用户不单独勾选
        actions:
          type: array
          description: 本菜单下可勾选的操作权限（写/删等）
          items:
            $ref: '#/components/schemas/MenuAction'

    MenuAction:
      type: object
      description: 菜单下的一个操作权限
      required: [key, label]
      properties:
        key:
          type: string
          description: 权限点 key，如 build.write
        label:
          type: string
          description: 上屏名称

    Permission:
      type: object
      required: [key, group, label]
      properties:
        key:
          type: string
        group:
          type: string
          description: 权限点所属模块，前端按它分组渲染
        label:
          type: string

    Role:
      type: object
      description: >-
        角色决定「能做什么业务」。超级管理员与平台管理员**不是角色**，
        它们是账号身份（isSuperAdmin / accountLevel），不会出现在角色列表里。
      required: [id, key, name, description, isBuiltin, tenantId, tenantName, permissions, menuKeys, createdAt]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          description: 同一公司内唯一；不同公司可以有同名角色（各自独立）
        name:
          type: string
        description:
          type: string
        isBuiltin:
          type: boolean
          description: 本公司预置的角色。可以修改权限，但不能删除
        tenantId:
          type: string
          description: 角色归属的公司；角色始终属于某一家公司（没有跨公司共享的角色）
        tenantName:
          type: string
          description: 归属公司名。超管跨公司查看时靠它区分同名角色
        permissions:
          type: array
          items:
            type: string
        menuKeys:
          type: array
          description: 该角色被授权可见的菜单 key，按公司隔离存储
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    RoleInput:
      type: object
      description: 新建 / 编辑角色；编辑时 key 被忽略
      additionalProperties: false
      required: [key, name, description, permissions]
      properties:
        key:
          type: string
          maxLength: 32
          pattern: '^[a-z][a-z0-9-]{1,31}$'
        name:
          type: string
          maxLength: 40
        description:
          type: string
          maxLength: 200
        permissions:
          type: array
          items:
            type: string
        menuKeys:
          type: array
          description: 本次授权的菜单，全量覆盖；不传则默认全量（兼容旧客户端）
          items:
            type: string

    PermissionListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/Permission'

    RoleResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/Role'

    RoleListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/Role'

    ApiKeyResult:
      type: object
      description: 轮换后的新 Key，明文只在本响应出现一次
      required: [apiKey]
      properties:
        apiKey:
          type: string

    AuditLog:
      type: object
      description: >
        一条审计记录；detail 是 JSON 文本，由写入方决定结构。
        mode 标出这条日志产生于哪个模式的分区——单人、团队各写各的表，
        跨模式互不可见，因此它是记录本身的属性而非筛选条件。
      required: [id, createdAt, mode, actorId, actorName, action, objectType, objectId, result, detail, ip]
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        mode:
          $ref: '#/components/schemas/SessionMode'
        actorId:
          type: string
        actorName:
          type: string
        action:
          type: string
        objectType:
          type: string
        objectId:
          type: string
        result:
          type: string
          enum: [success, failure]
        detail:
          type: string
        ip:
          type: string

    UserStatusInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [active, disabled]

    PasswordReset:
      type: object
      description: 一次性临时密码，只在该响应里出现一次
      required: [password]
      properties:
        password:
          type: string

    PasswordChange:
      type: object
      description: >
        修改自己的密码。oldPassword 必填：持有有效令牌不等于本人操作，
        校验旧密码才能挡住"手机被人拿起就改密码"的情况。
      additionalProperties: false
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
          description: 当前密码，用于确认操作者是本人
        newPassword:
          type: string
          description: 新密码，8-64 位，且不得与当前密码相同


    MetaSource:
      type: string
      description: >
        服务端派生的元数据来源内部标注：任一字段发生空值兜底 → fallback，否则 → parsed。
        不出现在 CommitBuildRequest 中，前端无法伪造、也不参与请求校验。
      enum: [parsed, fallback]

    ParsedMeta:
      type: object
      description: 自动解析的 4 个规范字段（Android / iOS 各 4 个原字段统一映射到这里）
      required: [appName, packageId, version, buildNumber]
      properties:
        appName:
          type: string
          description: Android Application.Label / iOS CFBundleDisplayName（缺失回退 CFBundleName）
        packageId:
          type: string
          description: Android Manifest.Package / iOS CFBundleIdentifier
        version:
          type: string
          description: Android versionName / iOS CFBundleShortVersionString
        buildNumber:
          type: string
          description: Android versionCode / iOS CFBundleVersion

    StageResult:
      type: object
      required: [stageToken, parsed, warnings]
      properties:
        stageToken:
          type: string
          format: uuid
          description: 暂存文件标识，1 小时有效，rename 后立即失效
        parsed:
          $ref: '#/components/schemas/ParsedMeta'
        warnings:
          type: array
          items:
            type: string
          description: 解析失败 / 损坏 / 超时的中文原因，不阻塞上传

    CommitBuildRequest:
      type: object
      description: >
        提交发布请求，application/json，**恰好 9 个字段**：项目 + token + 表单最终值。
        绝不包含 file 字段，也不携带解析结果、touched 标记或 metaSource（来源由服务端派生）。
      additionalProperties: false
      required: [project, stageToken, environment, platform]
      properties:
        project:
          type: string
          description: 项目 key；包归属于该项目
        stageToken:
          type: string
          format: uuid
        environment:
          $ref: '#/components/schemas/Environment'
        platform:
          $ref: '#/components/schemas/Platform'
        appName:
          type: string
          maxLength: 100
        packageId:
          type: string
          maxLength: 100
        version:
          type: string
          maxLength: 50
        buildNumber:
          type: string
          maxLength: 50
        changelog:
          type: string
          maxLength: 2000

    UpdateBuildRequest:
      type: object
      additionalProperties: false
      required: [appName, version, environment]
      properties:
        appName:
          type: string
          minLength: 1
          maxLength: 100
        version:
          type: string
          minLength: 1
          maxLength: 50
        buildNumber:
          type: string
          maxLength: 50
        environment:
          $ref: '#/components/schemas/Environment'
        changelog:
          type: string
          maxLength: 2000

    UploadTicketInput:
      type: object
      description: 申请 R2 直传票据；页面与外部 API 共用
      required: [project, fileName, size, contentType]
      properties:
        project:
          type: string
          description: 项目 key，用于构造带租户与项目归属的对象名
        fileName:
          type: string
          description: 原始文件名，用于推导扩展名与下载展示名
        size:
          type: integer
          format: int64
          description: 文件字节数，纳入签名，R2 会校验实际长度
        contentType:
          type: string
          description: MIME 类型，纳入签名，PUT 时必须一致
    UploadTicket:
      type: object
      description: R2 预签名 PUT 票据
      required: [uploadToken, putUrl, header, expiresInSeconds]
      properties:
        uploadToken:
          type: string
          description: 短期上传凭据，最后一步提交时用
        putUrl:
          type: string
          format: uri
          description: 预签名 PUT 地址，字节直接传到这里，不经过应用服务器
        header:
          type: object
          description: >
            PUT 时必须显式设置的请求头（参与签名）。Content-Length 也参与签名，
            但由客户端按文件大小自动发送，不在此列表中——手动设置会被浏览器拒绝。
          additionalProperties:
            type: string
        expiresInSeconds:
          type: integer
          description: 票据有效期（秒），过期需重新申请
    OpenStageFromR2Input:
      type: object
      description: 外部 API 直传的最后一步；只提交元信息，不传文件
      required: [uploadToken, project, environment, platform]
      properties:
        uploadToken:
          type: string
          description: 取票据时拿到的 uploadToken
        project:
          type: string
          description: 项目 key
        environment:
          $ref: '#/components/schemas/Environment'
        platform:
          $ref: '#/components/schemas/Platform'
        appName:
          type: string
          maxLength: 100
        packageId:
          type: string
          maxLength: 100
        version:
          type: string
          maxLength: 50
        buildNumber:
          type: string
          maxLength: 50
        changelog:
          type: string
          maxLength: 2000
    Build:
      type: object
      description: 完整包 DTO；三个 URL 字段由服务端派生；对外地址携带单版本分享凭证，授权失效时为空
      required:
        - id
        - environment
        - platform
        - appName
        - projectIconUrl
        - packageId
        - version
        - buildNumber
        - changelog
        - originalFileName
        - fileSize
        - fileExt
        - relativePath
        - metaSource
        - downloadCount
        - downloadPagePath
        - downloadSharePath
        - downloadPageUrl
        - downloadFileUrl
        - pinKind
        - r2State
        - localState
        - localPulledBytes
        - localError
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        environment:
          $ref: '#/components/schemas/Environment'
        platform:
          $ref: '#/components/schemas/Platform'
        appName:
          type: string
        projectIconUrl:
          type: string
          description: 所属项目图标的 data URL；空串表示未上传，下载页回退首字母
        packageId:
          type: string
        version:
          type: string
        buildNumber:
          type: string
        changelog:
          type: string
        originalFileName:
          type: string
          description: 已清洗的原始文件名，仅用于展示与下载名
        fileSize:
          type: integer
          format: int64
        fileExt:
          type: string
          enum: [apk, ipa]
        relativePath:
          type: string
          description: 相对 uploads 根目录的规范化路径
        metaSource:
          $ref: '#/components/schemas/MetaSource'
        downloadCount:
          type: integer
          format: int64
          description: 下载成功后才原子自增；起点 0、只增不减
        downloadPagePath:
          type: string
          description: 相对路径 /d/{id}，内部预览用（需登录）；无分享时的回退值
        downloadSharePath:
          type: string
          description: 带 shareToken 的相对路径 /d/{id}?shareToken=...，后台「下载页」按钮用它打开分享页（免登录）；分享失效时为空串
        pinKind:
          type: string
          description: 非空表示该版本被固定、永不参与容量淘汰（manual 为人工钉住）；空串表示可淘汰
        r2State:
          type: string
          enum: [pending, synced, evicted, failed]
          description: >
            对象存储侧状态。synced 表示对象在桶里、下载走 CDN 直链；
            evicted 表示已被容量淘汰，此时 r2_key 仍保留供「同步到 R2」重推复用。
            前端据此决定是否显示重推按钮。
        localPulledBytes:
          type: integer
          format: int64
          description: >
            已下载到本机的字节数，配合 fileSize 可算进度百分比。
            存数据库而不是只放内存：切换菜单、换标签页或刷新后仍需继续显示。
        localError:
          type: string
          description: >
            拉回失败的可读原因，失败时前端显示红字提示。
            只有文案，不含堆栈或内部路径——它是给管理员的操作依据。
        localState:
          type: string
          enum: [absent, pulling, present, failed]
          description: >
            本机留底状态。present 表示本机已归档，可回落本地流式下载；
            absent 表示尚无副本（直传刚完成，等待拉回）。
            与 r2State 各自独立：一个包可以「R2 有本机没有」，也可以「本机有 R2 已淘汰」。
        downloadPageUrl:
          type: string
          description: 有效分享的绝对地址，二维码与复制的唯一来源；分享失效时为空串
        downloadFileUrl:
          type: string
          description: 有效分享的绝对文件地址，下载按钮的唯一来源；分享失效时为空串
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 UTC
        ownerUserId:
          type: string
          description: 上传者账号 id；system 表示外部 API 或历史数据

    SharedBuild:
      type: object
      description: 免登录分享的单版本详情白名单；不含内部路径、上传者及原始文件名
      required:
        - id
        - environment
        - platform
        - appName
        - projectIconUrl
        - packageId
        - version
        - buildNumber
        - changelog
        - fileSize
        - fileExt
        - downloadCount
        - downloadPagePath
        - downloadPageUrl
        - downloadFileUrl
        - downloadDirectUrl
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        environment:
          $ref: '#/components/schemas/Environment'
        platform:
          $ref: '#/components/schemas/Platform'
        appName:
          type: string
        projectIconUrl:
          type: string
          description: 所属项目图标的 data URL；空串表示未上传，下载页回退首字母
        packageId:
          type: string
        version:
          type: string
        buildNumber:
          type: string
        changelog:
          type: string
        fileSize:
          type: integer
          format: int64
        fileExt:
          type: string
          enum: [apk, ipa]
        downloadCount:
          type: integer
          format: int64
          description: 下载成功后才原子自增；起点 0、只增不减
        downloadPagePath:
          type: string
          description: 相对路径 /d/{id}；唯一用途是前端 react-router 内部跳转，严禁用于二维码 / 复制 / 下载
        downloadPageUrl:
          type: string
          format: uri
          description: 绝对地址，二维码内容与复制按钮的唯一来源
        downloadFileUrl:
          type: string
          format: uri
          description: 本站文件接口地址；没有 CDN 直链时下载按钮回落到它
        downloadDirectUrl:
          type: string
          format: uri
          description: 对象已同步到 R2 且配置了公开域名时的 CDN 直链；为空表示走 downloadFileUrl
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 UTC
    SharedBuildResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/SharedBuild'

    PublicBuildVersion:
      type: object
      description: 下载页的环境、平台与版本选择项；只暴露跳转、辨识及版本说明所需字段
      required:
        - id
        - version
        - buildNumber
        - fileSize
        - changelog
        - environment
        - platform
        - createdAt
        - downloadPagePath
        - downloadPageUrl
        - projectKey
      properties:
        id:
          type: string
          format: uuid
        version:
          type: string
        buildNumber:
          type: string
        fileSize:
          type: integer
          format: int64
          description: 安装包大小（字节）
        changelog:
          type: string
          description: 上传者提供的更新说明，未填写时为空串
        environment:
          $ref: '#/components/schemas/Environment'
        platform:
          $ref: '#/components/schemas/Platform'
        createdAt:
          type: string
          format: date-time
        downloadPagePath:
          type: string
          description: 相对路径 /d/{id}；只用于前端路由跳转，严禁用于二维码 / 复制 / 下载
        downloadPageUrl:
          type: string
          description: 目标包自身的绝对分享地址；分享入口切换版本时必须使用此地址中的目标凭证；登录预览列表中为空串
        projectKey:
          type: string
          description: 包所属项目 key；登录预览的「查看更多」据此跳回应用包列表；分享列表为空串

    PublicBuildVersionsResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/PublicBuildVersion'

    ListBuildsResult:
      type: object
      required: [items, total, environment, platform]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Build'
        total:
          type: integer
        environment:
          $ref: '#/components/schemas/Environment'
        platform:
          type: string
          description: 实际生效的平台筛选，未筛选时为 all

    SyncProgress:
      type: object
      description: 一次后台「同步到 R2」的进度快照
      required: [state, bytes, total, error]
      properties:
        state:
          type: string
          enum: [idle, running, succeeded, failed]
          description: idle 表示没有进行中的同步，终态保留 10 分钟后回落到 idle
        bytes:
          type: integer
          format: int64
          description: 已上传字节数
        total:
          type: integer
          format: int64
          description: 总字节数；idle 时为 0
        error:
          type: string
          description: 失败原因；其它状态为空串
    StorageUsage:
      type: object
      description: 当前租户的对象存储用量视图；派生量全部由服务端算好
      required:
        - usedBytes
        - quotaBytes
        - freeBytes
        - estimatedUploads
        - buildCount
        - r2BuildCount
        - maxVersions
        - remainingVersions
        - pendingCount
        - failedCount
        - localBytes
        - localBuilds
        - localMissing
        - diskFreeBytes
        - groups
      properties:
        usedBytes:
          type: integer
          format: int64
          description: 已占用的对象存储字节数
        quotaBytes:
          type: integer
          format: int64
          description: 配额上限，当前为 9 GiB（给 10GB 免费额度留抖动余量）
        freeBytes:
          type: integer
          format: int64
          description: 剩余额度；已超额时为 0，不返回负数
        estimatedUploads:
          type: integer
          description: 按现有包的平均体积估算还能上传几个；无历史包时为 0
        buildCount:
          type: integer
          description: 记录总数，含已淘汰、不在对象存储里的
        r2BuildCount:
          type: integer
          description: 仍占用对象存储的包数，即参与配额竞争的数量
        maxVersions:
          type: integer
          description: 版本数上限，每个租户 66 个
        remainingVersions:
          type: integer
          description: 还能再保留几个版本
        pendingCount:
          type: integer
          description: 尚未同步到对象存储的包数
        failedCount:
          type: integer
          description: 同步失败的包数，需要人工关注
        localBytes:
          type: integer
          format: int64
          description: >
            本机已归档包的字节总和，只统计 localState=present 的记录。
            不能累加 file_size：直传包的记录里有大小，但字节只在 R2、本机没有文件，
            按状态过滤才与磁盘实际占用对得上。
        localBuilds:
          type: integer
          description: 本机已归档的包数
        localMissing:
          type: integer
          description: 本机尚无副本的包数（等待拉回或拉回失败）
        diskFreeBytes:
          type: integer
          format: int64
          description: >
            存储所在磁盘的可用字节；查询失败时为 0，前端据此隐藏本机那一段，
            而不是显示一个会让人以为磁盘满了的 0。
        groups:
          type: array
          description: 按项目/环境/平台分组，占用从大到小排序
          items:
            $ref: '#/components/schemas/StorageUsageGroup'

    StorageUsageGroup:
      type: object
      description: 一行分组用量
      required: [projectKey, environment, platform, buildCount, r2Bytes]
      properties:
        projectKey:
          type: string
        environment:
          type: string
        platform:
          type: string
        buildCount:
          type: integer
          description: 该组内仍占用对象存储的包数
        r2Bytes:
          type: integer
          format: int64

