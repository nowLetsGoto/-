  /admin/audit-logs:
    get:
      operationId: listAuditLogs
      summary: 审计日志（平台管理员及以上，只读）
      description: >-
        可见范围由服务端按身份收敛：平台管理员只看本公司，超级管理员看全部公司。
        仅团队模式下可用——单人分区的审计不带公司过滤，允许单人视图查询会跨公司泄漏。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: action
          in: query
          required: false
          description: 动作模糊匹配，如 user.disabled
          schema:
            type: string
        - name: actor
          in: query
          required: false
          description: 操作者账号模糊匹配
          schema:
            type: string
        - name: result
          in: query
          required: false
          schema:
            type: string
