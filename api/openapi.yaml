    # ── 研发中心 · 需求池 ───────────────────────────────────────────────────
    RequirementStatus:
      type: string
      description: 需求状态；本版只承载字段与筛选，流转逻辑留待后续迭代
      enum:
        - pending_review
        - confirmed
        - in_development
        - pending_acceptance
        - delivered
        - archived

    Requirement:
      type: object
      description: 需求池的一条记录；需求编号创建后不可变，创建人姓名与项目名由关联投影得到
      required: [id, reqKey, title, description, status, acceptanceCriteria, projectId, projectName, creatorUserId, creatorName, createdAt]
      properties:
        id:
          type: string
          format: uuid
        reqKey:
          type: string
          description: 用户可见的稳定编号，格式 REQ-YYYYMMDD-NNN
          pattern: '^REQ-\d{8}-\d{3}$'
        title:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 4000
        status:
          $ref: '#/components/schemas/RequirementStatus'
        acceptanceCriteria:
          type: string
          maxLength: 2000
        projectId:
          type: string
          format: uuid
          description: 所属项目 id；新建必填，V1.0 存量需求为空串
        projectName:
          type: string
          description: LEFT JOIN team.projects 的项目名投影；空串表示未归属项目
        creatorUserId:
          type: string
          description: 创建人账号 id（裸文本，不建外键）
        creatorName:
          type: string
          description: people.name 优先，回落 users.username；无关联时为空串
        createdAt:
          type: string
          format: date-time

    RequirementInput:
      type: object
      description: 新建需求的文本字段说明（POST 实际用 multipart，见 RequirementCreateMultipart）；未知字段一律 400
      additionalProperties: false
      required: [title, description, projectId]
      properties:
        title:
          type: string
          maxLength: 100
          description: 必填，1-100 字
        description:
          type: string
          maxLength: 4000
          description: 必填，多行文本
        status:
          $ref: '#/components/schemas/RequirementStatus'
          description: 留空由服务端兜底为 pending_review
        acceptanceCriteria:
          type: string
          maxLength: 2000
          description: 选填，多行文本
        projectId:
          type: string
          format: uuid
          description: 必填，所属项目 id，须存在且属于当前公司

    RequirementCreateMultipart:
      type: object
      description: 新建需求的一次性 multipart 请求体；文本字段严格白名单，图片部分名为 images
      required: [title, description, projectId]
      properties:
        title:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 4000
        status:
          $ref: '#/components/schemas/RequirementStatus'
        acceptanceCriteria:
          type: string
          maxLength: 2000
        projectId:
          type: string
          format: uuid
          description: 必填，所属项目 id，须存在且属于当前公司
        images:
          type: array
          maxItems: 9
          items:
            type: string
            format: binary
            description: png/jpg/jpeg/webp/gif 原图，单张 <= 5MB

    RequirementAttachment:
      type: object
      description: 需求图片的对外投影；存储相对路径不进响应，读取按附件 id 走受保护接口
      required: [id, fileName, contentType, fileSize, createdAt]
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
          description: CleanFileName 清洗后的展示名，不参与拼路径
        contentType:
          type: string
          description: 白名单内 MIME
        fileSize:
          type: integer
          format: int64
          description: 字节数，<= 5MB
        createdAt:
          type: string
          format: date-time

    RequirementDetail:
      allOf:
        - $ref: '#/components/schemas/Requirement'
        - type: object
          required: [attachments]
          properties:
            attachments:
              type: array
              description: 图片列表；无图片时为 []（存量需求兼容）
              items:
                $ref: '#/components/schemas/RequirementAttachment'

    RequirementResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/Requirement'

    RequirementDetailResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/RequirementDetail'

    RequirementListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [items, total, page, pageSize]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/Requirement'
                total:
                  type: integer
                  description: 总条数
                page:
                  type: integer
                  description: 当前页，从 1 开始
                pageSize:
                  type: integer
                  description: 每页条数；0 表示不分页（全量）

    # ── 研发中心 · 研发任务编排层 ───────────────────────────────────────────
    DevSubtaskStatus:
      type: string
      description: 子任务状态；十值与顺序的唯一来源是 x-rdc-dev-statuses
      enum:
        - pending
        - ai_running
        - ai_completed
        - reviewing
        - waiting_commit
        - committed
        - validated
        - completed
        - rejected
        - skipped

    DevSubtaskKind:
      type: string
      description: 子任务类型；一个任务固定 frontend / backend 各一条
      enum:
        - frontend
        - backend

    DevSubtask:
      type: object
      description: 研发子任务；status 只能经 transition / skip 变更，编辑接口不可达
      required: [id, kind, status, note, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/DevSubtaskKind'
        status:
          $ref: '#/components/schemas/DevSubtaskStatus'
        note:
          type: string
          maxLength: 500
          description: 可编辑的非状态备注
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DevTask:
      type: object
      description: >
        研发任务列表项；整体状态不落列，由两条子任务聚合推导。
        reqKey / requirementTitle / projectName / frontendStatus / backendStatus
        均为 JOIN 投影，不可编辑；tenantId 只参与服务端过滤，不进响应。
      required: [id, title, requirementId, reqKey, requirementTitle, projectName, overallStatus,
        frontendStatus, backendStatus, creatorUserId, creatorName, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 100
        requirementId:
          type: string
          format: uuid
          description: 绑定真相（一对多），换绑时须校验在 scope 内可见
        reqKey:
          type: string
          description: 关联需求的编号投影，仅展示与筛选
        requirementTitle:
          type: string
          description: 关联需求的标题投影
        projectName:
          type: string
          description: 需求所属项目名投影；空串表示未归属项目
        overallStatus:
          $ref: '#/components/schemas/DevSubtaskStatus'
          description: 两条子任务聚合出的整体状态；skipped 两条都命中时为 completed
        frontendStatus:
          $ref: '#/components/schemas/DevSubtaskStatus'
        backendStatus:
          $ref: '#/components/schemas/DevSubtaskStatus'
        creatorUserId:
          type: string
          description: 创建人账号 id（裸文本）
        creatorName:
          type: string
          description: people.name 优先，回落 users.username
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DevTaskDetail:
      allOf:
        - $ref: '#/components/schemas/DevTask'
        - type: object
          required: [subtasks]
          properties:
            subtasks:
              type: array
              description: 恰好两条（frontend / backend），始终非 nil
              items:
                $ref: '#/components/schemas/DevSubtask'

    DevTaskInput:
      type: object
      description: 新建研发任务的请求体；未知字段一律 400，归属字段由服务端推导
      additionalProperties: false
      required: [title, requirementId]
      properties:
        title:
          type: string
          maxLength: 100
          description: 必填，1-100 字
        requirementId:
          type: string
          format: uuid
          description: 必填，来源需求 id，须存在且在当前 scope 内可见

    DevSubtaskNoteUpdate:
      type: object
      description: 子任务的非状态属性更新；刻意没有 status 字段，任意层级出现 status 一律 400
      additionalProperties: false
      required: [id, note]
      properties:
        id:
          type: string
          format: uuid
        note:
          type: string
          maxLength: 500
          description: 备注，≤500 字

    DevTaskUpdate:
      type: object
      description: >
        编辑任务资料的请求体；只允许任务名 / 换绑需求 / 子任务备注，
        没有 status 字段。状态只能经 transition / skip 变更，SKIPPED 永久不可恢复。
      additionalProperties: false
      required: [title, requirementId]
      properties:
        title:
          type: string
          maxLength: 100
        requirementId:
          type: string
          format: uuid
          description: 换绑后的需求 id，须存在且在当前 scope 内可见
        subtasks:
          type: array
          description: 可选；只更新出现的子任务备注，绝不写状态
          items:
            $ref: '#/components/schemas/DevSubtaskNoteUpdate'

    DevTaskResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/DevTask'

    DevTaskDetailResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/DevTaskDetail'

    DevTaskListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [items, total, page, pageSize]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/DevTask'
                total:
                  type: integer
                  description: 总条数
                page:
                  type: integer
                  description: 当前页，从 1 开始
                pageSize:
                  type: integer
                  description: 每页条数；0 表示不分页（全量）

    DevSubtaskResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/DevSubtask'

    # ── 人工审核中心 ──────────────────────────────────────────────
    ReviewAction:
      type: string
      description: >
        审核动作枚举。前 4 值是既有状态动作（resubmit 由研发中心触发）；
        后 5 值是 AI 交互证据动作，其中 rollback_blocked 只写审计、不写审核记录；
        证据动作绝不触发子任务状态流转。
      enum: [approve, reject, commit, resubmit, diff_submitted, plan_confirmed, checkpoint_rolled_back, approval_decided, rollback_blocked]

    ReviewRejectInput:
      type: object
      description: 驳回请求体；原因必填
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: 驳回原因，1-500 字，必填

    ReviewCommitInput:
      type: object
      description: 提交确认请求体；commit SHA 必填
      additionalProperties: false
      required: [commitSha]
      properties:
        commitSha:
          type: string
          minLength: 1
          maxLength: 64
          description: 人工提交的 commit SHA，1-64 字，必填

    ReviewRecord:
      type: object
      description: 一次审核动作的事实记录（只追加）
      required: [id, taskId, subtaskId, action, reason, commitSha, reviewerUserId, detail, createdAt]
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        subtaskId:
          type: string
          format: uuid
        action:
          $ref: '#/components/schemas/ReviewAction'
        reason:
          type: string
          description: 驳回原因；其它动作为空串
        commitSha:
          type: string
          description: 提交 SHA；其它动作为空串
        reviewerUserId:
          type: string
        detail:
          type: object
          additionalProperties: true
          description: AI 交互证据的结构化 detail；既有审核动作为空对象
        createdAt:
          type: string
          format: date-time

    ReviewTask:
      type: object
      description: 待审任务列表项；含处于待审态的子任务信息
      required: [id, title, reqKey, requirementTitle, projectName, overallStatus, reviewableCount, frontendStatus, backendStatus, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        reqKey:
          type: string
        requirementTitle:
          type: string
        projectName:
          type: string
        overallStatus:
          type: string
          description: 任务整体状态（含 rejected）
        reviewableCount:
          type: integer
          description: 处于待审/待提交/已驳回的子任务数
        frontendStatus:
          type: string
        backendStatus:
          type: string
        createdAt:
          type: string
          format: date-time

    ReviewTaskListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [items, total, page, pageSize]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/ReviewTask'
                total:
                  type: integer
                page:
                  type: integer
                pageSize:
                  type: integer

    ReviewDetail:
      type: object
      description: 审核详情：任务、子任务与审核历史
      required: [task, subtasks, records]
      properties:
        task:
          $ref: '#/components/schemas/ReviewTask'
        subtasks:
          type: array
          items:
            $ref: '#/components/schemas/DevSubtask'
        records:
          type: array
          description: 该任务全部审核记录，按时间正序
          items:
            $ref: '#/components/schemas/ReviewRecord'

    TestResult: {type: string, enum: [not_registered, passed, failed]}
    AcceptanceStatus: {type: string, enum: [pending, passed, failed]}
    GitStatus: {type: string, enum: [ok, not_configured, path_forbidden, not_repo, timeout, error]}
