openapi: 3.1.0
info:
  title: Dandelion 应用包分发 API
  version: 1.0.0
  description: >
    全仓唯一契约 SSOT。环境、平台、路径、请求体、响应体、错误码与常量只在此定义一次。
    前端由 openapi-typescript 生成 web/src/api/schema.d.ts（生成物入库）；
    后端 Go 常量由 server/internal/contract/contract_test.go 与本文逐项比对，漂移即测试失败。
    运行时不加载本文件。

servers:
  - url: /api/v1
    description: 业务接口统一前缀；/healthz 独立挂在根下，不受此前缀影响。

# 契约级常量：后端 contract_test.go 读取校验，前端不使用（生成物忽略 x- 扩展）。
x-constants:
  maxUploadMB: 200
  stageTokenTTLSeconds: 3600
  parseTimeoutSeconds: 5
  parseReadLimitMB: 5
  downloadButtonCooldownSeconds: 3
  authTokenTTLSeconds: 43200
  rdcGitTimeoutSeconds: 5
  rdcGitMaxCommits: 10
  limits:
    appName: 100
    packageId: 100
    version: 50
    buildNumber: 50
    changelog: 2000
    username: 64
    password: 128
    webhookUrl: 500
    webhookSecret: 200
    projectKey: 32
    projectName: 60
    projectDescription: 200
    reqTitle: 100
    reqDescription: 4000
    reqAcceptance: 2000
  rdcMaxImageMB: 5
  rdcMaxImages: 9

# 需求图片 MIME 白名单：key 是 storage 落盘的规范扩展名，value 是嗅探到的 MIME。
# 后端 contract.RDCImageExts / 前端 utils/rdcUpload.ts 与此逐项对齐，由契约测试锁死。
x-rdc-image-exts:
  png: image/png
  jpg: image/jpeg
  jpeg: image/jpeg
  webp: image/webp
  gif: image/gif

# 研发子任务状态机唯一事实来源：顺序即进度序，skipped 列末尾且不参与序比较。
# 后端 contract.DevSubtaskStatuses / DevAdvance 由 contract_test.go 逐项锁死；
# 前端 utils/format.ts 的标签与下一态映射镜像本表，DDL 不加 CHECK。
x-rdc-dev-statuses:
  - pending
  - ai_running
  - ai_completed
  - reviewing
  - waiting_commit
  - committed
  - validated
  - completed
  - rejected
  - skipped
# 前进链（研发中心手动推进）：仍只含原 8 态的相邻边，rejected 不在前进链上。
x-rdc-dev-transitions:
  pending: ai_running
  ai_running: ai_completed
  ai_completed: reviewing
  reviewing: waiting_commit
  waiting_commit: committed
  committed: validated
  validated: completed
# 人工审核动作边：审核中心触发，与前进链分开声明，各自有专用端点。
# approve=审核通过(reviewing→waiting_commit)、reject=驳回(reviewing→rejected)、
# commit=提交确认(waiting_commit→committed)、resubmit=重新研发(rejected→ai_completed)。
# 后端用 contract.Can* 函数校验；rejected 为阻断态，需研发中心 resubmit 才能回到链路。
x-rdc-review-actions:
  approve: {from: reviewing, to: waiting_commit}
  reject: {from: reviewing, to: rejected}
  commit: {from: waiting_commit, to: committed}
  resubmit: {from: rejected, to: ai_completed}

# AI 人工交互层枚举唯一事实来源（后端 contract 镜像 + contract_test 逐项锁死，DDL 不加 CHECK）。
# 数据源边界 AgentArtifactProvider：Group A 生产注入 unavailableProvider，真实空态、零模拟数据。
x-rdc-interaction-review-decisions: [pending, accepted, rejected]
x-rdc-interaction-file-status: [added, modified, deleted, renamed]
x-rdc-interaction-source: [agent_executor]
x-rdc-interaction-submit-status: [pending, submitted]
x-rdc-interaction-question-type: [single, multiple, text]
x-rdc-interaction-gate-status: [blocked, confirmed]
x-rdc-interaction-checkpoint-status: [active, rolled_back, partially_rolled_back]
x-rdc-interaction-risk-level: [low, medium, high]
x-rdc-interaction-intervention: [exempt, sample, strict]
x-rdc-interaction-operation-type: [delete_file, config_change, dependency_change, schema_migration, permission_change, api_change, model_change, code_edit, format, comment, doc, add_test, style, add_file, other]
x-rdc-interaction-evidence-actions: [diff_submitted, plan_confirmed, checkpoint_rolled_back, approval_decided, rollback_blocked]
# 风险矩阵内置于契约（Q7）：未知 / other 就高不就低归 medium，整体风险取所有 hunk 的最大值。
x-rdc-interaction-risk-matrix:
  delete_file: high
  config_change: high
  dependency_change: high
  schema_migration: high
  permission_change: high
  api_change: medium
  model_change: medium
  code_edit: medium
  format: low
  comment: low
  doc: low
  add_test: low
  style: low
  add_file: low
  other: medium
x-rdc-interaction-interventions:
  low: exempt
  medium: sample
  high: strict

# ── 第 5 菜单「AI模型」枚举与边界（后端 contract/ai_model.go 镜像，契约测试逐项锁死）──
# 只列真实支持的值；新协议接入只改 AIProtocol enum + x-rdc-ai-protocols + 一个 protocol_xxx.go。
x-rdc-ai-providers: [scnet]
x-rdc-ai-protocols: [openai, anthropic, openai_responses]
x-rdc-ai-capabilities: [文本生成, 深度思考, 视觉理解]
x-rdc-ai-reasoning-efforts: [none, low, high, max]
x-rdc-ai-context-range: {min: 1024, max: 393216, default: 8192}
# temperature 上限按协议不同（anthropic 只接 0–1），配置期就该拒，别等调用期被上游 400。
x-rdc-ai-extra-config:
  temperature:      {type: number, minimum: 0, maximum: 2, default: 1}
  topP:             {type: number, minimum: 0, exclusiveMin: true, maximum: 1, default: 1}
  reasoningEffort:  {type: string, enum: [none, low, high, max], default: high}
  timeoutMs:        {type: integer, minimum: 1000, maximum: 120000, default: 30000}
x-rdc-ai-protocol-temperature:
  openai: {minimum: 0, maximum: 2}
  anthropic: {minimum: 0, maximum: 1}
  openai_responses: {minimum: 0, maximum: 2}
# 7 类：P0 六类 + capability_mismatch（有启用模型但无一条满足声明条件，绝不静默降级）。
x-rdc-ai-test-categories: [config_missing, auth_failed, parameter_error, rate_limited, network_error, response_error, capability_mismatch]
# 阈值默认值唯一来源（后端 contract.AIQuotaDefaults 镜像）；默认关闭，升级不改存量行为。
x-rdc-ai-quota:
  defaults: {enabled: false, maxCalls: 1000, windowMinutes: 60, action: warn}
  actions: [warn, reject]
  maxCallsRange: {min: 1, max: 1000000}
  windowMinutesRange: {min: 1, max: 10080}
  # extra_config 扩展口子：未知键原样保留，已知键只有 retentionDays（默认 90，区间 [7,365]）。
  retentionDaysDefault: 90
  retentionDaysRange: {min: 7, max: 365}
x-rdc-ai-usage:
  groupBy: [model, protocol, scene, day]
  defaultRangeDays: 7
# 只做「表单只读提示」展示，不参与任何调用逻辑（端点拼装在各 protocol_xxx.go）。
x-rdc-ai-protocol-endpoints:
  openai: {suffix: /chat/completions, auth: 'Authorization: Bearer'}
  anthropic: {suffix: /messages, auth: 'x-api-key + anthropic-version'}
  openai_responses: {suffix: /responses, auth: 'Authorization: Bearer'}
# 可选模板：用户点按钮填入表单，永不自动插库、不含任何 Key 字段。
x-rdc-ai-template:
  name: DeepSeek-V4.1-Flash-1017
  provider: scnet
  protocol: openai
  baseUrl: https://api.scnet.cn/api/llm/v1
  modelId: DeepSeek-V4.1-Flash-1017
  contextTokens: 8192
  thinkingEnabled: true
  capabilities: [文本生成, 深度思考, 视觉理解]

# Webhook 可推送字段的唯一产品定义处：key 固定，value 是设置页展示的中文名。
# 后端 contract.WebhookFieldLabels 镜像本表，由契约测试逐项比对；前端标签从接口返回，不再抄一份。
x-webhook-fields:
  id: 包 ID
  appName: 应用名
  packageId: 包名 / Bundle ID
  version: 版本号
  buildNumber: 构建号
  environment: 环境
  platform: 平台
  changelog: 更新说明
  fileSize: 文件大小
  originalFileName: 原始文件名
  downloadPageUrl: 下载页地址
  downloadFileUrl: 下载文件地址
  downloadCount: 下载次数
  createdAt: 上传时间

# 展示标签的唯一产品维度定义处；前端 utils/format.ts 以 Record<契约类型, string> 镜像。
x-environments:
  test: 测试
  hotfix: 紧急修复
  pre: 预发
  prd: 生产

# 平台元数据：扩展名、下载 Content-Type 全仓唯一定义处。
x-platforms:
  android:
    label: Android
    ext: apk
    contentType: application/vnd.android.package-archive
  ios:
    label: iOS
    ext: ipa
    contentType: application/octet-stream
  harmony:
    label: 鸿蒙
    ext: hap
    contentType: application/octet-stream

# 项目 key 的格式约束：只允许小写字母、数字与短横线，用于 URL 段。
x-project-key-pattern: '^[a-z0-9][a-z0-9-]{1,31}$'

x-page-routes:
  downloadPage: /d/{id}

paths:
  /projects:
    get:
      operationId: listProjects
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      summary: 项目列表
      description: >-
        返回范围由登录模式决定，不由参数决定：团队模式返回全量项目（项目切换器、
        项目守卫都用它）；单人模式只返回当前账号自己的项目——solo 分区的数据按人隔离，
        没有「看全部」这种可能。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 项目列表，按创建时间正序
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createProject
      summary: 新建项目
      description: key 只允许小写字母、数字与短横线，全仓唯一，创建后不可修改（它是 URL 段）。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /projects/{key}:
    get:
      operationId: getProject
      summary: 项目详情（含关联人员与团队的 ID）
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 项目详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: updateProject
      summary: 编辑项目（名称 / 描述 / 库地址；key 是 URL 段，不可修改）
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '200':
          description: 更新后的项目
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deleteProject
      summary: 删除项目
      description: >-
        只允许删除没有任何引用（应用包 / 成员 / 团队关联）的项目；有引用时返回 400 并说明剩余数量。
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          description: 项目 key（URL 段）
          schema:
            type: string
      responses:
        '200':
          description: 删除成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /people:
    get:
      operationId: listPeople
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      summary: 人员列表（含关联团队与项目 ID）
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 人员列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createPerson
      summary: 新增人员
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonInput'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /people/{id}:
    get:
      operationId: getPerson
      summary: 人员详情（含关联团队与项目 ID），编辑页回填用
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 人员详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updatePerson
      summary: 编辑人员（全量覆盖字段与关联）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonInput'
      responses:
        '200':
          description: 更新后的人员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deletePerson
      summary: 删除人员
      description: >-
        只允许删除没有任何引用（团队 / 项目 / 绑定账号）的人员；有引用时返回 400 并说明剩余数量。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 人员 id（UUID）
          schema:
            type: string
      responses:
        '200':
          description: 删除成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /teams:
    get:
      operationId: listTeams
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      summary: 团队列表（含关联人员与项目 ID）
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 团队列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createTeam
      summary: 新增团队
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamInput'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /teams/{id}:
    get:
      operationId: getTeam
      summary: 团队详情（含关联人员与项目 ID），编辑页回填用
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 团队详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateTeam
      summary: 编辑团队（全量覆盖字段与关联）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamInput'
      responses:
        '200':
          description: 更新后的团队
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deleteTeam
      summary: 删除团队
      description: >-
        只允许删除没有任何引用（成员 / 项目 / 管理员账号）的团队；有引用时返回 400 并说明剩余数量。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 团队 id（UUID）
          schema:
            type: string
      responses:
        '200':
          description: 删除成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /me:
    get:
      operationId: getMe
      summary: 当前登录人档案（含关联项目 key，用于列表页默认项目）
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 当前登录人
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/password:
    put:
      operationId: changeOwnPassword
      summary: 修改当前登录账号自己的密码（需校验旧密码，成功后旧令牌立即失效）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '200':
          description: 修改成功；旧令牌已失效，需重新登录
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /platform/tenants/{id}/status:
    post:
      operationId: setTenantStatus
      summary: 启用或停用公司（仅平台超级管理员）
      description: >-
        停用后该公司所有账号立即无法登录（登录时校验公司状态）。
        只改公司状态，不动其账号自身的启停状态，重新启用即可恢复。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 公司 id（UUID）
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, disabled]
      responses:
        '200':
          description: 更新后的公司
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非超级管理员

  /platform/tenants/{id}:
    delete:
      operationId: deleteTenant
      summary: 删除空公司（仅平台超级管理员）
      description: >-
        只允许删除没有任何业务数据的公司（人员 / 团队 / 项目 / 账号 / 自定义角色）。
        有数据时返回 400 并说明还剩什么，需先逐项清空。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 公司 id（UUID）
          schema:
            type: string
      responses:
        '200':
          description: 删除成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非超级管理员

  /platform/tenants:
    get:
      operationId: listTenants
      summary: 公司列表（仅平台超级管理员）
      security:
        - bearerAuth: []
      parameters:
