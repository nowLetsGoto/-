      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非超级管理员

  /roles/{id}:
    get:
      operationId: getRole
      summary: 角色详情
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 角色 id（全局唯一；key 只保证公司内唯一，超管视角下会歧义）
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 角色详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 缺少 role.read / role.write 权限
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateRole
      summary: 编辑角色名称 / 描述 / 权限与菜单授权
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 角色 id（全局唯一；key 只保证公司内唯一，超管视角下会歧义）
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
      responses:
        '200':
          description: 更新后的角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 缺少 role.read / role.write 权限
    delete:
      operationId: deleteRole
      summary: 删除角色
      description: >-
        只允许删除本公司自定义角色，且该角色未被任何人员或项目使用。平台内置角色与超管角色不可删除。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 角色 id
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 删除成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /settings:
    get:
      operationId: getSettings
      summary: 读取本公司系统设置（Webhook 配置 + 外部 API Key）
      description: 平台管理员取本公司配置；超级管理员取平台兜底配置。归属由登录身份推导，不接受请求参数。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 当前设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateSettings
      summary: 更新 Webhook 配置
      description: 只更新 Webhook 部分；API Key 由服务端生成，不在此接口修改。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookConfig'
      responses:
        '200':
          description: 更新后的完整设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /settings/git-repo:
    get:
      operationId: getGitRepo
      summary: 读取本公司 Git 仓库配置
      security: [{bearerAuth: []}]
      responses:
        '200': {description: 配置, content: {application/json: {schema: {$ref: '#/components/schemas/GitRepoConfigResponse'}}}}
    put:
      operationId: updateGitRepo
      summary: 保存本公司 Git 仓库路径
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GitRepoInput'}}}}
      responses:
        '200': {description: 配置, content: {application/json: {schema: {$ref: '#/components/schemas/GitRepoConfigResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}

  /settings/webhook/test:
    post:
      operationId: testWebhook
      summary: 向当前 Webhook 地址发一条示例消息
      description: >
        同步投递一条示例 payload，把目标返回的状态码带回来。
        目标不可达不算接口错误：仍返回 200，由 delivered/statusCode/message 表达结果。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 投递结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookTestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /settings/api-key/rotate:
    post:
      operationId: rotateApiKey
      summary: 轮换外部接口 API Key（仅超级管理员，旧 Key 立即失效）
      description: 新 Key 只在本次响应里出现一次，请立即保存到外部系统。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 新的 API Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyResultResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非平台管理员及以上

  /open/builds:
    post:
      operationId: openUploadBuild
      summary: 外部系统一步式上传安装包（CI / 脚本调用）
      description: >
        multipart/form-data，一次请求完成「写入暂存 + 解析 + 落盘 + 写库 + 生成地址」。
        鉴权用 X-API-Key（在系统设置页获取），不依赖管理员登录态。
        文本字段可省略：省略时用解析出的包信息补齐，再缺才用文件名兜底。
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, project, environment, platform]
              properties:
                file:
                  type: string
                  format: binary
                  description: .apk / .ipa / .hap，单包上限 200 MB
                project:
                  type: string
                  description: 项目 key
                environment:
                  $ref: '#/components/schemas/Environment'
                platform:
                  $ref: '#/components/schemas/Platform'
                appName:
                  type: string
                  maxLength: 100
                packageId:
                  type: string
                  maxLength: 100
                version:
                  type: string
                  maxLength: 50
                buildNumber:
                  type: string
                  maxLength: 50
                changelog:
                  type: string
                  maxLength: 2000
      responses:
        '201':
          description: 上传成功，返回完整 Build（含下载页与下载文件绝对地址）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      operationId: login
      summary: 管理员登录，换取访问令牌
      description: >
        单管理员账号模型：凭据由部署配置（ADMIN_USERNAME / ADMIN_PASSWORD）提供，不落库。
        成功返回无状态 HMAC 令牌（到期时间戳 + 签名），服务端不存会话；
        前端以 Authorization: Bearer <token> 访问受保护接口。
        凭据错误返回 400（与全站错误码口径一致）；401 专用于「未携带令牌或令牌失效」。
        同一「账号 + 来源 IP」连续失败 5 次后锁定 15 分钟，期间一律返回 429。
        不存在的账号同样计数，因此 429 不构成「账号是否存在」的信息泄露。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功，返回令牌与到期时间
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          description: 登录失败次数超限，临时锁定（同一账号 + IP 连续失败 5 次后锁定 15 分钟）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'

  /builds/stage:
    post:
      operationId: stageBuild
      summary: 暂存安装包并同步解析元数据
      description: >
        选文件时自动触发，对用户透明，不是两步发布。文件只上传这一次；
        服务端写入 storage/tmp/{stageToken}.{origExt} 后同步解析，
        解析失败、包损坏、超时只写入 warnings，接口恒返回 200。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 仅接受 .apk / .ipa，单包上限 200 MB
      responses:
        '200':
          description: 暂存成功（解析成败都成功）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /builds:
    post:
      operationId: commitBuild
      summary: 提交发布 commit（只发 token 与表单最终值，不携带文件、不再解析）
      description: >
        服务端校验 stageToken 后把暂存文件 rename 到正式目录、写库、生成三个 URL。
        表单即最终真值：不使用解析结果覆盖用户值，仅对空字段做文件名/占位值兜底。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitBuildRequest'
      responses:
        '201':
          description: 发布成功，返回完整 Build
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listBuilds
      summary: 按项目 + 环境（+平台）查询包列表，时间倒序，不分页
      security:
        - bearerAuth: []
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
          description: 项目 key；不同项目的包互不可见
        - name: environment
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/EnvironmentQuery'
        - name: platform
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PlatformQuery'
      responses:
        '200':
          description: "成功；空结果为 items: [] 而非 404"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBuildsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /builds/{id}:
    get:
      operationId: getBuild
      summary: 单个包详情（下载页取数）
      parameters:
        - $ref: '#/components/parameters/BuildId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /builds/{id}/versions:
    get:
      operationId: getBuildVersions
      summary: 同项目同应用的其它版本（公开下载页用）
      description: >
        按目标包定位分区与项目，只返回同项目、同 appName、同 packageId 的其它包，
        字段经白名单收敛，不含相对路径、上传者或原始文件名。
      parameters:
        - $ref: '#/components/parameters/BuildId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicBuildVersionsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /builds/{id}/file:
    get:
      operationId: downloadBuildFile
      summary: 下载原始包文件（唯一不套 JSON 的成功响应）
      description: >
        io.Copy 成功完成且写出字节等于 Content-Length 之后才原子 +1 下载次数；
        404、路径非法、文件缺失、客户端中断、copy 出错、字节不足一律不计数。
      parameters:
        - $ref: '#/components/parameters/BuildId'
      responses:
        '200':
          description: 二进制包流
          headers:
            Content-Type:
              schema:
                type: string
              description: Android 为 application/vnd.android.package-archive，iOS 为 application/octet-stream
            Content-Disposition:
              schema:
                type: string
              description: 同时提供 filename 与 RFC 5987 filename*=UTF-8''... 双重编码
            Content-Length:
              schema:
                type: integer
            Cache-Control:
              schema:
                type: string
              example: no-cache
            X-Content-Type-Options:
              schema:
                type: string
              example: nosniff
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /rdc/requirements:
    get:
      operationId: listRequirements
      summary: 需求池列表（仅团队模式）
      description: >
        数据范围由登录身份推导的 scope 决定，前端不传 tenant。支持按状态与可选项目 id 筛选、
        需求编号 / 标题的 ILIKE 关键字匹配，服务端分页（默认 10、上限 200、0 全量）。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: status
          in: query
          required: false
          description: 按需求状态筛选；留空表示不筛
          schema:
            $ref: '#/components/schemas/RequirementStatus'
        - name: keyword
          in: query
          required: false
          description: 匹配需求编号或标题（ILIKE 模糊匹配）
          schema:
            type: string
        - name: projectId
          in: query
          required: false
          description: 按所属项目 id 筛选；留空表示不筛。存量无归属需求不匹配该条件
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 需求分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createRequirement
      summary: 新建需求（仅团队模式）
      description: >
        文本字段（含必填 projectId）与 0..9 张图片一次提交；需求编号由服务端按
        REQ-YYYYMMDD-NNN 生成、创建后不可变，归属公司由身份推导，创建动作写入审计日志。
        图片格式 / 单张体积 / 数量在前端、handler、service 三层复校。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RequirementCreateMultipart'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /rdc/requirements/{reqKey}:
    get:
      operationId: getRequirement
      summary: 需求详情（仅团队模式）
      description: 按需求编号查询；越界或不存在的编号一律返回 404，不泄漏存在性。
      security:
        - bearerAuth: []
      parameters:
        - name: reqKey
          in: path
          required: true
          description: 需求编号，格式 REQ-YYYYMMDD-NNN
          schema:
            type: string
            pattern: '^REQ-\d{8}-\d{3}$'
      responses:
        '200':
          description: 需求详情（含项目名与图片附件列表）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /rdc/requirement-attachments/{id}:
    get:
      operationId: getRequirementAttachment
      summary: 需求图片读取（仅团队模式，受保护）
      description: >
        按附件 id 读取原图二进制流。登录 + rdc.requirement.read + team 模式 + 租户范围缺一不可；
        跨租户或不存在的附件统一 404，不泄漏存在性。相对路径经 SafeResolve 前缀校验防越界。
        前端必须用带 Bearer 的 Blob 请求渲染，裸 img src 会 401。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 附件 id（UUID）
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 图片二进制流
          headers:
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
            Content-Disposition:
              schema:
                type: string
                example: inline
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /rdc/dev/tasks:
    get:
      operationId: listDevTasks
      summary: 研发任务列表（仅团队模式）
      description: >
        数据范围由登录身份推导的 scope 决定。reqKey 按关联需求的编号精确匹配；
        status 按两条子任务聚合出的整体状态筛选（skipped 子任务不参与，两条都跳过视为 completed）。
        服务端分页（默认 10、上限 200、0 全量）。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: reqKey
          in: query
          required: false
          description: 关联需求编号，完整编号精确匹配；留空表示不筛
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: 整体状态筛选；八值之一，skipped 不作为整体态
          schema:
            $ref: '#/components/schemas/DevSubtaskStatus'
      responses:
        '200':
          description: 研发任务分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevTaskListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createDevTask
      summary: 新建研发任务（仅团队模式）
      description: >
        任务必须绑定一条本公司需求；创建时在同一事务内自动拆分 frontend / backend
        两条 pending 子任务。整体状态不落列，由子任务聚合推导。写 created 审计。
        全程只要求 rdc.dev.read，不新增写权限点。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevTaskInput'
      responses:
        '201':
          description: 创建成功（含两条子任务）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevTaskDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /rdc/dev/tasks/{id}:
    get:
      operationId: getDevTask
      summary: 研发任务详情（仅团队模式）
      description: 越界或不存在的任务一律 404，不泄漏存在性。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 研发任务 id（UUID）
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 任务详情（含两条子任务与需求投影）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevTaskDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateDevTask
      summary: 编辑研发任务资料（仅团队模式）
      description: >
        只改任务名、绑定需求与子任务备注。请求体任意层级出现 status 字段一律 400：
        编辑绝不写状态，状态只能经 transition / skip 两条专用路径变更。
        换绑的需求必须存在且属于当前 scope，越界 400。写 updated 审计。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 研发任务 id（UUID）
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevTaskUpdate'
      responses:
        '200':
          description: 编辑后的任务详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevTaskDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteDevTask
      summary: 删除研发任务（仅团队模式）
      description: 任务与两条子任务一并删除（外键级联），不可恢复；写 deleted 审计。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 研发任务 id（UUID）
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /rdc/dev/tasks/{id}/subtasks/{subtaskId}/transition:
    post:
      operationId: advanceDevSubtask
      summary: 手动推进子任务到下一状态（仅团队模式）
      description: >
        纯平台编排：只按 x-rdc-dev-transitions 前进一态，不接 Agent、不触发任何真实研发动作。
        终态 / skipped / 跳级 / 回退一律 400；并发点击时条件更新影响 0 行也返回 400，
        提示刷新后重试。写 transitioned 审计。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 研发任务 id（UUID）
          schema:
            type: string
            format: uuid
        - name: subtaskId
          in: path
          required: true
          description: 子任务 id（UUID）
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 推进后的子任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevSubtaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /rdc/dev/tasks/{id}/subtasks/{subtaskId}/skip:
    post:
      operationId: skipDevSubtask
      summary: 将子任务标记为已跳过（仅团队模式）
      description: >
        仅序 0..6 的未完成态可标记；completed / skipped 为终态不可再标。
        标记后永久不可恢复：没有 unskip 接口、编辑 DTO 也不可达。写 skipped 审计。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 研发任务 id（UUID）
          schema:
            type: string
            format: uuid
        - name: subtaskId
          in: path
          required: true
          description: 子任务 id（UUID）
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 标记后的子任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevSubtaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /rdc/dev/tasks/{id}/subtasks/{subtaskId}/resubmit:
    post:
      operationId: resubmitDevSubtask
      summary: 驳回后重新研发（rejected → ai_completed，仅团队模式）
      description: >
        研发中心触发：仅 rejected 态可重新研发，回到 ai_completed 等待再次提交审核。
        这是 rejected 阻断态回到链路的唯一出口；其它状态一律 400。
        状态写入复用与手动推进相同的条件更新，审计 from/to 同源。写 transitioned 审计。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 研发任务 id（UUID）
          schema:
            type: string
            format: uuid
        - name: subtaskId
          in: path
          required: true
          description: 子任务 id（UUID）
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 重新研发后的子任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevSubtaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /rdc/reviews/tasks:
    get:
      operationId: listReviewTasks
      summary: 待审研发任务列表（仅团队模式）
      description: >
        列出含「待审核(reviewing) / 待提交(waiting_commit) / 已驳回(rejected)」子任务的任务。
        服务端分页，支持按 reqKey 筛选。数据范围由 scope 决定，仅本公司可见。
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: {type: integer, default: 1}
        - name: pageSize
          in: query
          schema: {type: integer, default: 10}
        - name: reqKey
          in: query
          description: 需求编号精确筛选
          schema: {type: string}
      responses:
        '200':
          description: 待审任务分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewTaskListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /rdc/reviews/tasks/{id}:
    get:
      operationId: getReviewTask
      summary: 审核详情：任务、子任务与审核历史（仅团队模式）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 研发任务 id（UUID）
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 审核详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /rdc/reviews/tasks/{id}/subtasks/{subtaskId}/approve:
    post:
      operationId: approveDevSubtask
      summary: 审核通过（reviewing → waiting_commit，仅团队模式）
      description: 仅 reviewing 态可审核通过；写 approve 审核记录与 transitioned 审计。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: subtaskId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: 通过后的子任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevSubtaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /rdc/reviews/tasks/{id}/subtasks/{subtaskId}/reject:
    post:
      operationId: rejectDevSubtask
      summary: 审核驳回（reviewing → rejected，仅团队模式）
      description: >
        仅 reviewing 态可驳回，驳回原因必填。驳回后子任务进入 rejected 阻断态，
        需研发中心「重新研发」才能回到链路。写 reject 审核记录与审计。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: subtaskId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRejectInput'
      responses:
        '200':
          description: 驳回后的子任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevSubtaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /rdc/reviews/tasks/{id}/subtasks/{subtaskId}/commit:
    post:
      operationId: commitDevSubtask
      summary: 人工提交确认（waiting_commit → committed，仅团队模式）
      description: >
        仅 waiting_commit 态可确认提交，commit SHA 必填。纯平台记录，不触发真实 Git 操作。
        写 commit 审核记录与审计。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: subtaskId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCommitInput'
      responses:
        '200':
          description: 提交确认后的子任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevSubtaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /rdc/delivery/records:
    get:
      operationId: listDeliveryRecords
      summary: 按需求列出最新交付快照
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/PageParam'}
        - {$ref: '#/components/parameters/PageSizeParam'}
        - {name: keyword, in: query, schema: {type: string}}
        - {name: acceptanceStatus, in: query, schema: {$ref: '#/components/schemas/AcceptanceStatus'}}
        - {name: archived, in: query, schema: {type: boolean}}
      responses:
        '200': {description: 交付列表, content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryRecordListResponse'}}}}
  /rdc/delivery/records/{requirementId}:
    get:
      operationId: getDeliveryDetail
      summary: 读取需求交付详情与历史
      security: [{bearerAuth: []}]
      parameters: [{name: requirementId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: 交付详情, content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryDetailResponse'}}}}
  /rdc/delivery/records/{requirementId}/git/refresh:
    post:
      operationId: refreshDeliveryGit
      summary: 只读刷新本机 Git 记录
      security: [{bearerAuth: []}]
      parameters: [{name: requirementId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: 读取结果, content: {application/json: {schema: {$ref: '#/components/schemas/GitSnapshotResponse'}}}}
  /rdc/delivery/records/{requirementId}/test:
    post:
      operationId: registerDeliveryTest
      summary: 人工登记外部测试报告摘要
      security: [{bearerAuth: []}]
      parameters: [{name: requirementId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TestRegisterInput'}}}}
      responses:
        '200': {description: 当前快照, content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryRecordResponse'}}}}
  /rdc/delivery/records/{requirementId}/accept:
    post:
      operationId: acceptDelivery
      summary: 逐条确认当前验收标准
      security: [{bearerAuth: []}]
      parameters: [{name: requirementId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryAcceptInput'}}}}
      responses:
        '200': {description: 当前快照, content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryRecordResponse'}}}}
  /rdc/delivery/records/{requirementId}/archive:
    post:
      operationId: archiveDelivery
      summary: 原子归档需求与交付快照
      security: [{bearerAuth: []}]
      parameters: [{name: requirementId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: 归档快照, content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryRecordResponse'}}}}

  # ── AI 人机交互层（team 专属，挂 03 人工审核中心，只写证据不改子任务状态）──
  /rdc/interactions/tasks/{id}/subtasks/{subtaskId}/diff-review:
    get:
      operationId: getRDCInteractionDiffReview
      summary: 读取子任务最新 Diff 审查对象（仅团队模式）
      description: >
        产物只来自 AgentArtifactProvider。执行器未就绪时返回真实空态 data:null，
        不返回任何模拟 diff；只读，不改变研发子任务状态。
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: subtaskId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Diff 审查对象或空态 null, content: {application/json: {schema: {$ref: '#/components/schemas/DiffReviewResponse'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /rdc/interactions/tasks/{id}/subtasks/{subtaskId}/diff-review/submit:
    post:
      operationId: submitRDCInteractionDiffReview
      summary: 提交 hunk 三态决策并留痕（仅团队模式）
      description: >
        存在 pending hunk 时 400；全非 pending 才写决策 + diff_submitted 审核记录 + 审计。
        本操作绝不更新 rdc_dev_subtask.status。
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: subtaskId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DiffReviewInput'}}}}
      responses:
        '200': {description: 已提交的 Diff 审查对象, content: {application/json: {schema: {$ref: '#/components/schemas/DiffReviewResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /rdc/interactions/diff-reviews/{reviewId}/hunks/{hunkId}/decision:
    put:
      operationId: setRDCInteractionHunkDecision
      summary: 单 hunk 三态决策（仅团队模式）
      description: 只 UPSERT 决策表，不写审核记录；提交审查时统一留一条 diff_submitted 证据。
      security: [{bearerAuth: []}]
      parameters:
        - {name: reviewId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: hunkId, in: path, required: true, schema: {type: string, maxLength: 128}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/HunkDecisionInput'}}}}
      responses:
        '200': {description: 更新后的 Diff 审查对象, content: {application/json: {schema: {$ref: '#/components/schemas/DiffReviewResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /rdc/interactions/tasks/{id}/subtasks/{subtaskId}/plan-confirmation:
    get:
      operationId: getRDCInteractionPlan
      summary: 读取子任务计划确认对象（仅团队模式）
      description: 无真实产物时返回真实空态 data:null；只读。
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: subtaskId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 计划确认对象或空态 null, content: {application/json: {schema: {$ref: '#/components/schemas/PlanConfirmationResponse'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /rdc/interactions/plan-confirmations/{planId}/confirm:
    post:
      operationId: confirmRDCInteractionPlan
      summary: 确认计划门禁（仅团队模式）
      description: >
        必答题已答 + 所有计划任务已确认才放行；写 gate_status/confirmed_by/at + plan_confirmed 证据与审计。
        只表达意图对齐完成，不推进子任务状态、不触发生成。
      security: [{bearerAuth: []}]
      parameters: [{name: planId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PlanConfirmInput'}}}}
      responses:
        '200': {description: 已确认的计划对象, content: {application/json: {schema: {$ref: '#/components/schemas/PlanConfirmationResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /rdc/interactions/tasks/{id}/subtasks/{subtaskId}/checkpoints:
    get:
      operationId: listRDCInteractionCheckpoints
      summary: 读取子任务检查点时间线（仅团队模式）
      description: 只读；无真实产物时返回空数组，绝不伪造快照。
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: subtaskId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 检查点时间线, content: {application/json: {schema: {$ref: '#/components/schemas/CheckpointListResponse'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /rdc/interactions/checkpoints/{checkpointId}/rollback:
    post:
      operationId: rollbackRDCInteractionCheckpoint
      summary: 检查点回滚（仅团队模式）
      description: >
        必须携带服务端 rollback_token；逐文件比对 currentHashes 与 afterHash。
        任一不匹配 → 409 列出冲突文件 + rollback_blocked 失败审计，绝不强制覆盖；
        匹配 → 写 checkpoint_rolled_back 证据并更新检查点状态，不回退子任务状态。
        本版只做证据层，不写真实文件。
      security: [{bearerAuth: []}]
      parameters: [{name: checkpointId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RollbackInput'}}}}
      responses:
        '200': {description: 已记录的检查点, content: {application/json: {schema: {$ref: '#/components/schemas/CheckpointResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /rdc/interactions/tasks/{id}/subtasks/{subtaskId}/approval:
    get:
      operationId: getRDCInteractionApproval
      summary: 读取分级审批徽标（仅团队模式）
      description: 整体风险取该子任务全部 hunk 风险最大值；低免审 / 中抽查 / 高强审批。
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: subtaskId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 审批徽标, content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalResponse'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /rdc/interactions/tasks/{id}/subtasks/{subtaskId}/approval/decide:
    post:
      operationId: decideRDCInteractionApproval
      summary: 记录分级审批决定（仅团队模式）
      description: 写 approval_decided 证据 + 审计；是业务介入强度证据，不是新权限点、不是状态边。
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: subtaskId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalDecideInput'}}}}
      responses:
        '200': {description: 审批徽标与决定, content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  # ── 第 5 菜单「AI模型」（team 专属；Key 只显示掩码，无前端可直调的 Chat 路由）──
  /rdc/models:
    get:
      operationId: listAIModels
      summary: 按公司列出模型配置（仅团队模式）
      description: 普通账号只看本公司；超管必须带 tenantId，未指定时返回空列表。
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/PageParam'}
        - {$ref: '#/components/parameters/PageSizeParam'}
        - {name: enabled, in: query, schema: {type: boolean}}
        - {name: protocol, in: query, schema: {$ref: '#/components/schemas/AIProtocol'}, description: 按报文协议筛选（三协议并存后用于快速定位同一公司的协议分布）}
        - {name: tenantId, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 模型列表, content: {application/json: {schema: {$ref: '#/components/schemas/AIModelListResponse'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createAIModel
      summary: 新建模型配置（仅团队模式）
      description: Key 经 AES-GCM 加密入库，响应只返回末 4 位掩码；tenantId 由服务端从身份推导。
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AIModelInput'}}}}
      responses:
        '201': {description: 新建的模型, content: {application/json: {schema: {$ref: '#/components/schemas/AIModelResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  # 静态段必须先于 /rdc/models/{id} 声明（chi 静态优先，注册顺序同样如此），否则会被参数段吞掉。
  /rdc/models/usage:
    get:
      operationId: getAIModelUsage
      summary: 按公司统计模型调用（仅团队模式）
      description: >
        半开区间 [start, end)，缺省最近 7 天。平均耗时只算「成功且已出站」，
        token 只对上报了 usage 的记录求和（未上报返回 null，不是 0）。
        超管未指定 tenantId 时返回空统计，不做跨公司聚合。
      security: [{bearerAuth: []}]
      parameters:
        - {name: start, in: query, schema: {type: string, format: date-time}, description: 区间起点（含），缺省 end-7d}
        - {name: end, in: query, schema: {type: string, format: date-time}, description: 区间终点（不含），缺省当前整点}
        - {name: groupBy, in: query, schema: {type: string}, description: 逗号分隔，可组合：model,protocol,scene,day}
        - {name: includeLocal, in: query, schema: {type: boolean, default: false}, description: 是否含本地拒绝（未出站）记录}
        - {name: tenantId, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 统计结果, content: {application/json: {schema: {$ref: '#/components/schemas/AIModelUsageResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /rdc/models/quota:
    get:
      operationId: getAIModelQuota
      summary: 读取本公司调用阈值（仅团队模式）
      description: 每公司一行；无配置行时返回默认值（enabled=false / 1000 / 60 / warn），不返回零值。
      security: [{bearerAuth: []}]
      parameters:
        - {name: tenantId, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 阈值配置, content: {application/json: {schema: {$ref: '#/components/schemas/AIQuotaResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      operationId: updateAIModelQuota
      summary: 整行覆盖本公司调用阈值（仅团队模式）
      description: 请求体不接受 tenantId（超管用 ?tenantId=）；写入成功后记一条 rdc.ai_model.quota_updated 审计。
      security: [{bearerAuth: []}]
      parameters:
        - {name: tenantId, in: query, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AIQuotaInput'}}}}
      responses:
        '200': {description: 更新后的阈值, content: {application/json: {schema: {$ref: '#/components/schemas/AIQuotaResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /rdc/models/{id}:
    get:
      operationId: getAIModel
      summary: 读取模型详情（仅团队模式）
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: tenantId, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 模型详情, content: {application/json: {schema: {$ref: '#/components/schemas/AIModelResponse'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: updateAIModel
      summary: 编辑模型资料（仅团队模式）
      description: apiKey 留空表示不更新；请求体不接受 tenantId / isDefault / enabled / apiKeyMask。
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: tenantId, in: query, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AIModelInput'}}}}
      responses:
        '200': {description: 更新后的模型, content: {application/json: {schema: {$ref: '#/components/schemas/AIModelResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      operationId: deleteAIModel
      summary: 软删模型（enabled=false，仅团队模式）
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: tenantId, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 软删完成, content: {application/json: {schema: {$ref: '#/components/schemas/AIModelResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /rdc/models/{id}/default:
    post:
      operationId: setAIModelDefault
      summary: 设为本公司默认模型（事务互斥，仅团队模式）
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: tenantId, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 新的默认模型, content: {application/json: {schema: {$ref: '#/components/schemas/AIModelResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /rdc/models/{id}/status:
    post:
      operationId: setAIModelStatus
      summary: 启用 / 停用模型（仅团队模式）
      description: 停用默认模型时若本公司另有启用模型，须先指定新默认；禁用行的 isDefault 恒为 false。
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: tenantId, in: query, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AIModelStatusInput'}}}}
      responses:
        '200': {description: 更新后的模型, content: {application/json: {schema: {$ref: '#/components/schemas/AIModelResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /rdc/models/{id}/test:
    post:
      operationId: testAIModel
      summary: 用该模型已存 Key 实测一次（仅团队模式）
      description: 与内部 ModelService.Chat 共用 chatOnce；上游错误按六类返回脱敏结果，不回显 Key 与原报文。
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: tenantId, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 实测结果（成功与失败均在此表达）, content: {application/json: {schema: {$ref: '#/components/schemas/AIModelTestResultResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /healthz:
    get:
      operationId: health
      summary: 健康检查（独立于 /api/v1，供 compose/systemd 探活）
      description: 该路径挂在根下， servers.url 前缀对它不生效。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        登录接口返回的 token。除 /auth/login、/healthz、/builds/{id}、/builds/{id}/file
        之外的管理接口都要求携带 Authorization: Bearer <token>。
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        外部系统专用。Key 在「系统设置 → 外部 API」查看，由服务端生成，
        与管理员登录态互不影响，只授权 /open/builds。

  parameters:
    PageParam:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始；缺省或非法按 1 处理
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: pageSize
      in: query
      required: false
      description: 每页条数，默认 10、上限 200；显式传 0 表示不分页（返回全量，供下拉选项与聚合使用）
      schema:
        type: integer
        minimum: 0
        maximum: 200
        default: 10
    BuildId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: 包稳定唯一标识

  responses:
    BadRequest:
      description: 缺文件 / 枚举非法 / 平台与文件类型不一致 / 字段超长 / stageToken 失效 / 登录凭据错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 未携带令牌、签名非法或令牌已过期；前端据此清空本地会话并回到登录页
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 已登录但无权执行该操作（身份层级或角色权限不足）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 请求的资源不存在或已被移除
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 冲突：检查点回滚哈希不匹配 / rollback_token 无效或已回滚（禁止强制覆盖）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: 请求方法不支持
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooLarge:
      description: 超过 200 MB 单包上限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: 写文件 / 写库 / 未预期错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    WebhookField:
      type: string
      description: 可推送到 Webhook 的包字段；展示名见 x-webhook-fields
      enum:
        [id, appName, packageId, version, buildNumber, environment, platform,
         changelog, fileSize, originalFileName, downloadPageUrl, downloadFileUrl,
         downloadCount, createdAt]

    WebhookConfig:
      type: object
      description: >
        Webhook 配置。enabled=true 时 url 必填且必须是 http(s) 绝对地址；
        secret 非空时投递会带 X-Dandelion-Signature: sha256=<HMAC-SHA256(body)>。
      additionalProperties: false
      required: [enabled, url, secret, fields]
      properties:
        enabled:
          type: boolean
        url:
          type: string
          maxLength: 500
        secret:
          type: string
          maxLength: 200
        fields:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WebhookField'

    WebhookFieldOption:
      type: object
      description: 设置页渲染复选框用的字段目录，标签由服务端给出，前端不再抄一份
      required: [key, label]
      properties:
        key:
          $ref: '#/components/schemas/WebhookField'
        label:
          type: string

    Settings:
      type: object
      required: [webhook, apiKeyConfigured, availableFields, gitRepo]
      properties:
        webhook:
          $ref: '#/components/schemas/WebhookConfig'
        apiKeyConfigured:
          type: boolean
          description: >-
            是否已生成过外部上传接口的 Key。Key 本身只存 SHA-256 摘要，
            本接口不返回明文；要拿明文请调用轮换接口（一次性返回）。
        availableFields:
          type: array
          items:
            $ref: '#/components/schemas/WebhookFieldOption'
        gitRepo:
          $ref: '#/components/schemas/GitRepoConfig'

    WebhookTestResult:
      type: object
      description: 测试投递结果；目标不可达也是 200，用 delivered=false 表达
      required: [delivered, statusCode, message]
      properties:
        delivered:
          type: boolean
        statusCode:
          type: integer
          description: 目标返回的 HTTP 状态码；未收到响应时为 0
        message:
          type: string

    LoginRequest:
      type: object
      description: 管理员登录请求；mode 省略时按单人模式处理。
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          maxLength: 128
        mode:
          $ref: '#/components/schemas/SessionMode' 

    SessionMode:
      type: string
      description: 登录模式；solo 单人只看自己产生的数据，team 团队看全量平台数据
      enum: [solo, team]
      default: solo

    AccountLevel:
      type: string
      description: >
        管理身份层级，决定「能管谁、管多大范围」，与业务角色正交。
        顺序 super_admin > platform_admin > team_admin > member；
        与 users.account_level 的 CHECK 约束、Go 的 contract.AccountLevel* 常量一一对应。
      enum: [super_admin, platform_admin, team_admin, member]
      default: member

    LoginResult:
      type: object
      description: >
        无状态令牌：载荷含账号、令牌版本、到期时间与登录模式，签名由 AUTH_SECRET 生成。
        服务端不存会话，重启后令牌仍然有效；前端存 localStorage 并随请求发送。
      required: [token, username, expiresAt, mode, accountLevel, tenantId]
      properties:
        token:
          type: string
          description: 形如「账号|版本|到期时间戳|模式.HMAC-SHA256 签名」的 BASE64URL 串
        username:
          type: string
        expiresAt:
          type: string
          format: date-time
          description: ISO 8601 UTC，由 x-constants.authTokenTTLSeconds 推出
        mode:
          $ref: '#/components/schemas/SessionMode'
        accountLevel:
          $ref: '#/components/schemas/AccountLevel'
        tenantId:
          type: string
          description: 账号所属公司 id；超管为空串。仅供首屏展示，服务端判定一律以令牌重建的身份为准

    Environment:
      type: string
      description: 四环境枚举，全仓唯一定义处；DB 只 NOT NULL 不加 CHECK
      enum: [test, hotfix, pre, prd]

    Platform:
      type: string
      description: 平台枚举；label / ext / contentType 见 x-platforms
      enum: [android, ios, harmony]

    EnvironmentQuery:
      type: string
      description: 环境筛选，all 表示全部环境
      enum: [all, test, hotfix, pre, prd]

    PlatformQuery:
      type: string
      description: 平台筛选，省略或 all 表示不筛
      enum: [all, android, ios, harmony]

    Project:
      type: object
      description: 项目是业务数据的一级归属：应用包、应用、热更新都挂在项目下
      required: [id, key, name, description, repoUrl, iconUrl, roleKey, roleName, createdAt]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          description: URL 段，创建后不可修改
        name:
          type: string
        description:
          type: string
        repoUrl:
          type: string
          description: 项目库地址（GitLab / GitHub 等），空串表示未填；详情页渲染为可点击链接
        iconUrl:
          type: string
          description: 项目图标 data URL；空串表示未上传，列表回退首字母占位
        roleKey:
          type: string
          description: 项目角色标识；为空表示沿用人员自身角色
        roleName:
          type: string
        createdAt:
          type: string
          format: date-time

    ProjectInput:
      type: object
      description: 新建 / 编辑项目请求；编辑时 key 被忽略
      additionalProperties: false
      required: [key, name, description, repoUrl, roleKey]
      properties:
        key:
          type: string
          maxLength: 32
          pattern: '^[a-z0-9][a-z0-9-]{1,31}$'
          description: 小写字母 / 数字 / 短横线，2-32 位，全仓唯一
        name:
          type: string
          maxLength: 60
        description:
          type: string
          maxLength: 200
        repoUrl:
          type: string
          maxLength: 300
          description: http(s) 绝对地址；留空表示未填
        iconUrl:
          type: string
          maxLength: 700000
          description: 项目图标 data URL（png/jpg/webp，≤512KB）；留空表示不上传
        roleKey:
          type: string
          description: 项目角色标识；留空表示沿用人员自身角色

    ProjectDetail:
      type: object
      description: 项目详情 = 项目本身 + 关联的人员与团队（带名字）
      required: [id, key, name, description, repoUrl, iconUrl, roleKey, roleName, createdAt, persons, teams]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        description:
          type: string
        repoUrl:
          type: string
        iconUrl:
          type: string
        roleKey:
          type: string
        roleName:
          type: string
        createdAt:
          type: string
          format: date-time
        persons:
          type: array
          items:
            $ref: '#/components/schemas/RelationRef'
        teams:
          type: array
          items:
            $ref: '#/components/schemas/RelationRef'

    RelationRef:
      type: object
      description: 关联的轻量投影（id + 名字）；列表接口直接带回，前端不必再拉对方列表
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string

    Person:
      type: object
      description: 人员；teams / projects 是带名字的多选关联
      required: [id, name, email, phone, title, roleKey, roleName, teams, projects, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        username:
          type: string
          description: 与登录账号对应；空表示只在通讯录里，不能登录
        email:
          type: string
        phone:
          type: string
        title:
          type: string
        roleKey:
          type: string
          description: 该人员的角色标识；空表示未分配
        roleName:
          type: string
        teams:
          type: array
          items:
            $ref: '#/components/schemas/RelationRef'
        projects:
          type: array
          items:
            $ref: '#/components/schemas/RelationRef'
        createdAt:
          type: string
          format: date-time

    PersonInput:
      type: object
      description: 新增 / 编辑人员请求
      additionalProperties: false
      required: [name, username, email, phone, title, roleKey, teamIds, projectIds]
      properties:
        name:
          type: string
          maxLength: 40
        username:
          type: string
          maxLength: 64
        email:
          type: string
          maxLength: 120
        phone:
          type: string
          maxLength: 40
        title:
          type: string
          maxLength: 60
        roleKey:
          type: string
          description: 角色标识；留空表示未分配
        teamIds:
          type: array
          items:
            type: string
        projectIds:
          type: array
          items:
            type: string

    Team:
      type: object
      description: 团队；persons / projects 是带名字的多选关联
      required: [id, name, description, persons, projects, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        persons:
          type: array
          items:
            $ref: '#/components/schemas/RelationRef'
        projects:
          type: array
          items:
            $ref: '#/components/schemas/RelationRef'
        createdAt:
          type: string
          format: date-time

    TeamInput:
      type: object
      description: 新增 / 编辑团队请求
      additionalProperties: false
      required: [name, description, personIds, projectIds]
      properties:
        name:
          type: string
          maxLength: 60
        description:
          type: string
          maxLength: 200
        personIds:
          type: array
          items:
            type: string
        projectIds:
          type: array
          items:
            type: string

    Me:
      type: object
      description: 当前登录人；没有对应人员记录时 personId 为空、projectKeys 为空
      required: [username, personId, name, roleKey, roleName, projectKeys, isSuperAdmin, tenantId, tenantName, accountLevel, teamIds, permissions, menuKeys]
      properties:
        username:
          type: string
        personId:
          type: string
        name:
          type: string
        roleKey:
          type: string
          description: 人员在团队里的角色 key；未分配角色时为空串
        roleName:
          type: string
          description: 角色名；为空表示该人员没有角色，前端统一显示「普通用户」
        projectKeys:
          type: array
          description: 该人员关联的项目 key，按项目创建顺序；前端据此决定列表页默认项目
          items:
            type: string
        isSuperAdmin:
          type: boolean
          description: 是否超级管理员；前端据此决定是否渲染「超级管理员」菜单（真正的边界在服务端 403）
        tenantId:
          type: string
          description: 账号所属公司 id；超管为空串
        tenantName:
          type: string
          description: 公司名，由 tenants 表按 tenantId 查得；超管为空串
        accountLevel:
          $ref: '#/components/schemas/AccountLevel'
        teamIds:
          type: array
          description: 数据范围内的团队 id 并集，由 authz.Service.ScopeOf 推导；超管与公司管理员为空数组表示不限团队
          items:
            type: string
            format: uuid
        permissions:
          type: array
          description: 平台级权限点（不含项目）；项目内权限可能被项目角色覆盖，由各接口判定
          items:
            type: string
        menuKeys:
          type: array
          description: >-
            当前角色被授权可见的菜单 key，供前端收窄侧栏。不是判定依据，真正边界在后端守卫。
            超管拿到全部菜单；未分配角色时为空数组。
          items:
            type: string

    User:
      type: object
      description: 账号视图（不含任何密码字段）
      required: [id, username, mode, personId, personName, roleKey, roleName, isSuperAdmin, status, lastLoginAt, lastLoginIp, createdAt, accountLevel, tenantId, teamIds]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        mode:
          $ref: '#/components/schemas/SessionMode'
        personId:
          type: string
          description: 绑定的人员档案 id，空表示未绑定
        personName:
          type: string
        roleKey:
          type: string
          description: 绑定人员的角色 key；账号本身没有角色，角色挂在人员身上
        roleName:
          type: string
          description: 角色名；为空表示未分配角色，前端显示「普通用户」
        isSuperAdmin:
          type: boolean
        status:
          type: string
          enum: [active, disabled]
        lastLoginAt:
          type: string
          format: date-time
        lastLoginIp:
          type: string
        createdAt:
          type: string
          format: date-time
        accountLevel:
          $ref: '#/components/schemas/AccountLevel'
          description: 管理身份层级，与业务角色正交
        tenantId:
          type: string
          description: 账号归属公司；超管为空
        teamIds:
          type: array
          description: 团队管理员可管的团队 id；其它层级为空数组
          items:
            type: string

    UserInput:
      type: object
      description: >-
        新建账号。没有 mode 字段：账号归属模式由创建者的登录模式决定，
        登录时已选定模式，页面上只做只读展示。
        accountLevel 只能传比调用者低的层级，越权由服务端拒绝；归属公司从调用者推导，不接受请求指定。
      additionalProperties: false
      required: [username, password, personId, isSuperAdmin, accountLevel, teamIds]
      properties:
        username:
          type: string
          maxLength: 32
          pattern: '^[a-zA-Z0-9._-]{3,32}$'
        password:
          type: string
          minLength: 8
          maxLength: 64
        personId:
          type: string
          description: >-
            绑定的人员档案 id；留空会建出一个没有角色、登录后也拿不到业务权限的账号，
            因此平台管理员与团队管理员创建时必填（超管可先建号、之后再绑）。
        roleKey:
          type: string
          description: >-
            随绑定人员一起写入的角色标识（写的是 people.role_key，users 表没有角色列）。
            留空表示沿用该人员现有角色；非空时服务端校验调用者能否分配该角色——
            非超管分配 super-admin 一律拒绝。
        isSuperAdmin:
          type: boolean
        accountLevel:
          $ref: '#/components/schemas/AccountLevel'
        teamIds:
          type: array
          description: 仅 accountLevel=team_admin 时有意义，且必须落在调用者可见的团队内
          items:
            type: string

    UserUpdate:
      type: object
      description: >-
        编辑账号（登录名与模式都不可改）。roleKey 写的是绑定人员的角色（people.role_key），
        因此「在这里改角色」与「在人员管理里改角色」是同一件事。
      additionalProperties: false
      required: [personId, roleKey, isSuperAdmin]
      properties:
        personId:
          type: string
          description: 绑定的人员档案 id；为空时 roleKey 会被忽略（角色必须挂在人身上）
        roleKey:
          type: string
          description: 绑定人员的角色 key；空串表示不分配角色
        isSuperAdmin:
          type: boolean

    TenantInput:
      type: object
      description: 新建公司及其平台管理员；两者原子创建，明文密码只在响应里返回一次
      additionalProperties: false
      required: [name, code, adminUsername, adminPassword]
      properties:
        name:
          type: string
          description: 公司名称
        code:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,31}$'
          description: 公司标识，小写字母/数字/短横线
        adminUsername:
          type: string
          pattern: '^[a-zA-Z0-9._-]{3,32}$'
          description: 平台管理员账号名
        adminPassword:
          type: string
          minLength: 8
          maxLength: 64
          description: 平台管理员初始密码

    Tenant:
      type: object
      description: 公司视图（含其平台管理员账号名）
      required: [id, name, code, status, adminUsername, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
        status:
          type: string
          enum: [active, disabled]
        adminUsername:
          type: string
        createdAt:
          type: string
          format: date-time

    TenantResult:
      type: object
      description: 新建公司的结果；password 是平台管理员的一次性明文密码
      required: [tenant, password]
      properties:
        tenant:
          $ref: '#/components/schemas/Tenant'
        password:
          type: string

    TenantListResponse:
      type: object
      description: 统一响应外壳，data 为公司分页列表
      required: [code, data, message]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: object
          required: [items, page, pageSize, total]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Tenant'
            page:
              type: integer
            pageSize:
              type: integer
            total:
              type: integer

    TenantCreateResponse:
      type: object
      description: 统一响应外壳，data 为新建公司结果
      required: [code, data, message]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/TenantResult'

    TenantResponse:
      type: object
      description: 统一响应外壳，data 为单个公司
      required: [code, data, message]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/Tenant'

    Menu:
      type: object
      description: 平台级菜单资源，路径即 key；自带查看权限与操作权限，构成完整的授权树节点
      required: [key, label, group, viewPermission, actions]
      properties:
        key:
          type: string
          description: 页面路径，如 /overview、/directory/roles
        label:
          type: string
          description: 上屏名称
        group:
          type: string
          description: 一级分组名，用于渲染授权树
        viewPermission:
          type: string
          description: 勾选本菜单即自动授予的查看权限，用户不单独勾选
        actions:
          type: array
          description: 本菜单下可勾选的操作权限（写/删等）
          items:
            $ref: '#/components/schemas/MenuAction'

    MenuAction:
      type: object
      description: 菜单下的一个操作权限
      required: [key, label]
      properties:
        key:
          type: string
          description: 权限点 key，如 build.write
        label:
          type: string
          description: 上屏名称

    Permission:
      type: object
      required: [key, group, label]
      properties:
        key:
          type: string
        group:
          type: string
          description: 权限点所属模块，前端按它分组渲染
        label:
          type: string

    Role:
      type: object
      description: >-
        角色决定「能做什么业务」。超级管理员与平台管理员**不是角色**，
        它们是账号身份（isSuperAdmin / accountLevel），不会出现在角色列表里。
      required: [id, key, name, description, isBuiltin, tenantId, tenantName, permissions, menuKeys, createdAt]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          description: 同一公司内唯一；不同公司可以有同名角色（各自独立）
        name:
          type: string
        description:
          type: string
        isBuiltin:
          type: boolean
          description: 本公司预置的角色。可以修改权限，但不能删除
        tenantId:
          type: string
          description: 角色归属的公司；角色始终属于某一家公司（没有跨公司共享的角色）
        tenantName:
          type: string
          description: 归属公司名。超管跨公司查看时靠它区分同名角色
        permissions:
          type: array
          items:
            type: string
        menuKeys:
          type: array
          description: 该角色被授权可见的菜单 key，按公司隔离存储
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    RoleInput:
      type: object
      description: 新建 / 编辑角色；编辑时 key 被忽略
      additionalProperties: false
      required: [key, name, description, permissions]
      properties:
        key:
          type: string
          maxLength: 32
          pattern: '^[a-z][a-z0-9-]{1,31}$'
        name:
          type: string
          maxLength: 40
        description:
          type: string
          maxLength: 200
        permissions:
          type: array
          items:
            type: string
        menuKeys:
          type: array
          description: 本次授权的菜单，全量覆盖；不传则默认全量（兼容旧客户端）
          items:
            type: string

    PermissionListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/Permission'

    RoleResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/Role'

    RoleListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/Role'

    ApiKeyResult:
      type: object
      description: 轮换后的新 Key，明文只在本响应出现一次
      required: [apiKey]
      properties:
        apiKey:
          type: string

    AuditLog:
      type: object
      description: >
        一条审计记录；detail 是 JSON 文本，由写入方决定结构。
        mode 标出这条日志产生于哪个模式的分区——单人、团队各写各的表，
        跨模式互不可见，因此它是记录本身的属性而非筛选条件。
      required: [id, createdAt, mode, actorId, actorName, action, objectType, objectId, result, detail, ip]
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        mode:
          $ref: '#/components/schemas/SessionMode'
        actorId:
          type: string
        actorName:
          type: string
        action:
          type: string
        objectType:
          type: string
        objectId:
          type: string
        result:
          type: string
          enum: [success, failure]
        detail:
          type: string
        ip:
          type: string

    UserStatusInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [active, disabled]

    PasswordReset:
      type: object
      description: 一次性临时密码，只在该响应里出现一次
      required: [password]
      properties:
        password:
          type: string

    PasswordChange:
      type: object
      description: >
        修改自己的密码。oldPassword 必填：持有有效令牌不等于本人操作，
        校验旧密码才能挡住"手机被人拿起就改密码"的情况。
      additionalProperties: false
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
          description: 当前密码，用于确认操作者是本人
        newPassword:
          type: string
          description: 新密码，8-64 位，且不得与当前密码相同


    MetaSource:
      type: string
      description: >
        服务端派生的元数据来源内部标注：任一字段发生空值兜底 → fallback，否则 → parsed。
        不出现在 CommitBuildRequest 中，前端无法伪造、也不参与请求校验。
      enum: [parsed, fallback]

    ParsedMeta:
      type: object
      description: 自动解析的 4 个规范字段（Android / iOS 各 4 个原字段统一映射到这里）
      required: [appName, packageId, version, buildNumber]
      properties:
        appName:
          type: string
          description: Android Application.Label / iOS CFBundleDisplayName（缺失回退 CFBundleName）
        packageId:
          type: string
          description: Android Manifest.Package / iOS CFBundleIdentifier
        version:
          type: string
          description: Android versionName / iOS CFBundleShortVersionString
        buildNumber:
          type: string
          description: Android versionCode / iOS CFBundleVersion

    StageResult:
      type: object
      required: [stageToken, parsed, warnings]
      properties:
        stageToken:
          type: string
          format: uuid
          description: 暂存文件标识，1 小时有效，rename 后立即失效
        parsed:
          $ref: '#/components/schemas/ParsedMeta'
        warnings:
          type: array
          items:
            type: string
          description: 解析失败 / 损坏 / 超时的中文原因，不阻塞上传

    CommitBuildRequest:
      type: object
      description: >
        提交发布请求，application/json，**恰好 9 个字段**：项目 + token + 表单最终值。
        绝不包含 file 字段，也不携带解析结果、touched 标记或 metaSource（来源由服务端派生）。
      additionalProperties: false
      required: [project, stageToken, environment, platform]
      properties:
        project:
          type: string
          description: 项目 key；包归属于该项目
        stageToken:
          type: string
          format: uuid
        environment:
          $ref: '#/components/schemas/Environment'
        platform:
          $ref: '#/components/schemas/Platform'
        appName:
          type: string
          maxLength: 100
        packageId:
          type: string
          maxLength: 100
        version:
          type: string
          maxLength: 50
        buildNumber:
          type: string
          maxLength: 50
        changelog:
          type: string
          maxLength: 2000

    Build:
      type: object
      description: 完整包 DTO；三个 URL 字段由服务端 buildURLs(id) 派生，不入库
      required:
        - id
        - environment
        - platform
        - appName
        - projectIconUrl
        - packageId
        - version
        - buildNumber
        - changelog
        - originalFileName
        - fileSize
        - fileExt
        - relativePath
        - metaSource
        - downloadCount
        - downloadPagePath
        - downloadPageUrl
        - downloadFileUrl
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        environment:
          $ref: '#/components/schemas/Environment'
        platform:
          $ref: '#/components/schemas/Platform'
        appName:
          type: string
        projectIconUrl:
          type: string
          description: 所属项目图标的 data URL；空串表示未上传，下载页回退首字母
        packageId:
          type: string
        version:
          type: string
        buildNumber:
          type: string
        changelog:
          type: string
        originalFileName:
          type: string
          description: 已清洗的原始文件名，仅用于展示与下载名
        fileSize:
          type: integer
          format: int64
        fileExt:
          type: string
          enum: [apk, ipa]
        relativePath:
          type: string
          description: 相对 uploads 根目录的规范化路径
        metaSource:
          $ref: '#/components/schemas/MetaSource'
        downloadCount:
          type: integer
          format: int64
          description: 下载成功后才原子自增；起点 0、只增不减
        downloadPagePath:
          type: string
          description: 相对路径 /d/{id}；唯一用途是前端 react-router 内部跳转，严禁用于二维码 / 复制 / 下载
        downloadPageUrl:
          type: string
          format: uri
          description: 绝对地址，二维码内容与复制按钮的唯一来源
        downloadFileUrl:
          type: string
          format: uri
          description: 绝对地址，下载按钮的唯一来源
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 UTC
        ownerUserId:
          type: string
          description: 上传者账号 id；system 表示外部 API 或历史数据

    PublicBuildVersion:
      type: object
      description: 公开下载页「其它版本」列表项；只暴露跳转与辨识所需字段
      required:
        - id
        - version
        - buildNumber
        - environment
        - platform
        - createdAt
        - downloadPagePath
        - projectKey
      properties:
        id:
          type: string
          format: uuid
        version:
          type: string
        buildNumber:
          type: string
        environment:
          $ref: '#/components/schemas/Environment'
        platform:
          $ref: '#/components/schemas/Platform'
        createdAt:
          type: string
          format: date-time
        downloadPagePath:
          type: string
          description: 相对路径 /d/{id}；只用于前端路由跳转，严禁用于二维码 / 复制 / 下载
        projectKey:
          type: string
          description: 包所属项目 key；「查看更多」据此跳回应用包列表

    PublicBuildVersionsResponse:
      allOf:
