    GitSnapshotResponse:
      allOf:
        - {$ref: '#/components/schemas/ApiResponse'}
        - {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/GitSnapshot'}}}
    DeliveryRecordListResponse:
      allOf:
