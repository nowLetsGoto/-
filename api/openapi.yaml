openapi: 3.1.0
info:
  title: Dandelion 应用包分发 API
  version: 1.0.0
  description: >
    全仓唯一契约 SSOT。环境、平台、路径、请求体、响应体、错误码与常量只在此定义一次。
    前端由 openapi-typescript 生成 web/src/api/schema.d.ts（生成物入库）；
    后端 Go 常量由 server/internal/contract/contract_test.go 与本文逐项比对，漂移即测试失败。
    运行时不加载本文件。

servers:
  - url: /api/v1
    description: 业务接口统一前缀；/healthz 独立挂在根下，不受此前缀影响。

# 契约级常量：后端 contract_test.go 读取校验，前端不使用（生成物忽略 x- 扩展）。
x-constants:
  maxUploadMB: 200
  stageTokenTTLSeconds: 3600
  parseTimeoutSeconds: 5
  parseReadLimitMB: 5
  downloadButtonCooldownSeconds: 3
  authTokenTTLSeconds: 43200
  limits:
    appName: 100
    packageId: 100
    version: 50
    buildNumber: 50
    changelog: 2000
    username: 64
    password: 128
    webhookUrl: 500
    webhookSecret: 200
    projectKey: 32
    projectName: 60
    projectDescription: 200

# Webhook 可推送字段的唯一产品定义处：key 固定，value 是设置页展示的中文名。
# 后端 contract.WebhookFieldLabels 镜像本表，由契约测试逐项比对；前端标签从接口返回，不再抄一份。
x-webhook-fields:
  id: 包 ID
  appName: 应用名
  packageId: 包名 / Bundle ID
  version: 版本号
  buildNumber: 构建号
  environment: 环境
  platform: 平台
  changelog: 更新说明
  fileSize: 文件大小
  originalFileName: 原始文件名
  downloadPageUrl: 下载页地址
  downloadFileUrl: 下载文件地址
  downloadCount: 下载次数
  createdAt: 上传时间

# 展示标签的唯一产品维度定义处；前端 utils/format.ts 以 Record<契约类型, string> 镜像。
x-environments:
  test: 测试
  hotfix: 紧急修复
  pre: 预发
  prd: 生产

# 平台元数据：扩展名、下载 Content-Type 全仓唯一定义处。
x-platforms:
  android:
    label: Android
    ext: apk
    contentType: application/vnd.android.package-archive
  ios:
    label: iOS
    ext: ipa
    contentType: application/octet-stream
  harmony:
    label: 鸿蒙
    ext: hap
    contentType: application/octet-stream

# 项目 key 的格式约束：只允许小写字母、数字与短横线，用于 URL 段。
x-project-key-pattern: '^[a-z0-9][a-z0-9-]{1,31}$'

x-page-routes:
  downloadPage: /d/{id}

paths:
  /projects:
    get:
      operationId: listProjects
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      summary: 项目列表
      description: >-
        返回范围由登录模式决定，不由参数决定：团队模式返回全量项目（项目切换器、
        项目守卫都用它）；单人模式只返回当前账号自己的项目——solo 分区的数据按人隔离，
        没有「看全部」这种可能。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 项目列表，按创建时间正序
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createProject
      summary: 新建项目
      description: key 只允许小写字母、数字与短横线，全仓唯一，创建后不可修改（它是 URL 段）。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /projects/{key}:
    get:
      operationId: getProject
      summary: 项目详情（含关联人员与团队的 ID）
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 项目详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: updateProject
      summary: 编辑项目（名称 / 描述 / 库地址；key 是 URL 段，不可修改）
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '200':
          description: 更新后的项目
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /people:
    get:
      operationId: listPeople
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      summary: 人员列表（含关联团队与项目 ID）
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 人员列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createPerson
      summary: 新增人员
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonInput'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /people/{id}:
    get:
      operationId: getPerson
      summary: 人员详情（含关联团队与项目 ID），编辑页回填用
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 人员详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updatePerson
      summary: 编辑人员（全量覆盖字段与关联）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonInput'
      responses:
        '200':
          description: 更新后的人员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /teams:
    get:
      operationId: listTeams
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      summary: 团队列表（含关联人员与项目 ID）
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 团队列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createTeam
      summary: 新增团队
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamInput'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /teams/{id}:
    get:
      operationId: getTeam
      summary: 团队详情（含关联人员与项目 ID），编辑页回填用
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 团队详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateTeam
      summary: 编辑团队（全量覆盖字段与关联）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamInput'
      responses:
        '200':
          description: 更新后的团队
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me:
    get:
      operationId: getMe
      summary: 当前登录人档案（含关联项目 key，用于列表页默认项目）
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 当前登录人
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/password:
    put:
      operationId: changeOwnPassword
      summary: 修改当前登录账号自己的密码（需校验旧密码，成功后旧令牌立即失效）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '200':
          description: 修改成功；旧令牌已失效，需重新登录
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /platform/tenants:
    get:
      operationId: listTenants
      summary: 公司列表（仅平台超级管理员）
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: 公司列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非超级管理员
    post:
      operationId: createTenant
      summary: 新建公司及其平台管理员（仅平台超级管理员）
      description: 公司与平台管理员账号原子创建；响应里的 password 是该管理员的一次性明文密码
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantInput'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCreateResponse'
        '400':
          description: 参数不合法或名称/标识/账号名被占用
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非超级管理员

  /admin/users:
    get:
      operationId: listUsers
      summary: 账号列表（团队管理员及以上；范围由身份层级决定）
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: keyword
          in: query
          required: false
          description: 同时匹配登录名与绑定人员姓名
          schema:
            type: string
      responses:
        '200':
          description: 账号列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非超级管理员
    post:
      operationId: createUser
      summary: 新建账号（仅超级管理员）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非超级管理员

  /admin/users/{id}:
    get:
      operationId: getUser
      summary: 账号详情（仅超级管理员；供编辑页回填）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 账号详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非超级管理员
        '404':
          description: 账号不存在，或不属于当前登录模式
    put:
      operationId: updateUser
      summary: 改绑定人员、角色与超管标记（登录名与模式不可改）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: 更新后的账号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非超级管理员
    delete:
      operationId: deleteUser
      summary: 删除账号（不可恢复；不能删自己，也不能删掉最后一个可用超管）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 被删除的账号（前端据此提示"已删除 xxx"）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非超级管理员
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/users/{id}/reset-password:
    post:
      operationId: resetUserPassword
      summary: 重置密码，返回一次性临时密码
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 临时密码（只出现这一次）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非超级管理员
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/users/{id}/status:
    post:
      operationId: setUserStatus
      summary: 启用 / 禁用账号（禁用会立即让该账号的令牌失效）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserStatusInput'
      responses:
        '200':
          description: 更新后的账号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非超级管理员

  /admin/audit-logs:
    get:
      operationId: listAuditLogs
      summary: 审计日志（仅超级管理员，只读）
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: action
          in: query
          required: false
          description: 动作模糊匹配，如 user.disabled
          schema:
            type: string
        - name: actor
          in: query
          required: false
          description: 操作者账号模糊匹配
          schema:
            type: string
        - name: result
          in: query
          required: false
          schema:
            type: string
            enum: [success, failure]
      responses:
        '200':
          description: 审计日志列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非超级管理员

  /permissions:
    get:
      operationId: listPermissions
      summary: 权限点目录（仅超级管理员；前端据此渲染勾选矩阵，避免把目录抄进前端）
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 权限点列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非超级管理员

  /roles:
    get:
      operationId: listRoles
      summary: 角色列表（仅超级管理员；含各自权限点）
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 角色列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非超级管理员
    post:
      operationId: createRole
      summary: 新建自定义角色（仅超级管理员）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非超级管理员

  /roles/{key}:
    get:
      operationId: getRole
      summary: 角色详情（仅超级管理员）
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 角色详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非超级管理员
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateRole
      summary: 编辑角色名称 / 描述 / 权限（仅超级管理员；超管角色权限不可改）
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
      responses:
        '200':
          description: 更新后的角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非超级管理员

  /settings:
    get:
      operationId: getSettings
      summary: 读取系统设置（Webhook 配置 + 外部 API Key）
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 当前设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateSettings
      summary: 更新 Webhook 配置
      description: 只更新 Webhook 部分；API Key 由服务端生成，不在此接口修改。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookConfig'
      responses:
        '200':
          description: 更新后的完整设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /settings/webhook/test:
    post:
      operationId: testWebhook
      summary: 向当前 Webhook 地址发一条示例消息
      description: >
        同步投递一条示例 payload，把目标返回的状态码带回来。
        目标不可达不算接口错误：仍返回 200，由 delivered/statusCode/message 表达结果。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 投递结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookTestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /settings/api-key/rotate:
    post:
      operationId: rotateApiKey
      summary: 轮换外部接口 API Key（仅超级管理员，旧 Key 立即失效）
      description: 新 Key 只在本次响应里出现一次，请立即保存到外部系统。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 新的 API Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyResultResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 非超级管理员

  /open/builds:
    post:
      operationId: openUploadBuild
      summary: 外部系统一步式上传安装包（CI / 脚本调用）
      description: >
        multipart/form-data，一次请求完成「写入暂存 + 解析 + 落盘 + 写库 + 生成地址」。
        鉴权用 X-API-Key（在系统设置页获取），不依赖管理员登录态。
        文本字段可省略：省略时用解析出的包信息补齐，再缺才用文件名兜底。
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, project, environment, platform]
              properties:
                file:
                  type: string
                  format: binary
                  description: .apk / .ipa / .hap，单包上限 200 MB
                project:
                  type: string
                  description: 项目 key
                environment:
                  $ref: '#/components/schemas/Environment'
                platform:
                  $ref: '#/components/schemas/Platform'
                appName:
                  type: string
                  maxLength: 100
                packageId:
                  type: string
                  maxLength: 100
                version:
                  type: string
                  maxLength: 50
                buildNumber:
                  type: string
                  maxLength: 50
                changelog:
                  type: string
                  maxLength: 2000
      responses:
        '201':
          description: 上传成功，返回完整 Build（含下载页与下载文件绝对地址）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      operationId: login
      summary: 管理员登录，换取访问令牌
      description: >
        单管理员账号模型：凭据由部署配置（ADMIN_USERNAME / ADMIN_PASSWORD）提供，不落库。
        成功返回无状态 HMAC 令牌（到期时间戳 + 签名），服务端不存会话；
        前端以 Authorization: Bearer <token> 访问受保护接口。
        凭据错误返回 400（与全站错误码口径一致）；401 专用于「未携带令牌或令牌失效」。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功，返回令牌与到期时间
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'

  /builds/stage:
    post:
      operationId: stageBuild
      summary: 暂存安装包并同步解析元数据
      description: >
        选文件时自动触发，对用户透明，不是两步发布。文件只上传这一次；
        服务端写入 storage/tmp/{stageToken}.{origExt} 后同步解析，
        解析失败、包损坏、超时只写入 warnings，接口恒返回 200。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 仅接受 .apk / .ipa，单包上限 200 MB
      responses:
        '200':
          description: 暂存成功（解析成败都成功）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /builds:
    post:
      operationId: commitBuild
      summary: 提交发布 commit（只发 token 与表单最终值，不携带文件、不再解析）
      description: >
        服务端校验 stageToken 后把暂存文件 rename 到正式目录、写库、生成三个 URL。
        表单即最终真值：不使用解析结果覆盖用户值，仅对空字段做文件名/占位值兜底。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitBuildRequest'
      responses:
        '201':
          description: 发布成功，返回完整 Build
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listBuilds
      summary: 按项目 + 环境（+平台）查询包列表，时间倒序，不分页
      security:
        - bearerAuth: []
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
          description: 项目 key；不同项目的包互不可见
        - name: environment
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Environment'
        - name: platform
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PlatformQuery'
      responses:
        '200':
          description: "成功；空结果为 items: [] 而非 404"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBuildsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /builds/{id}:
    get:
      operationId: getBuild
      summary: 单个包详情（下载页取数）
      parameters:
        - $ref: '#/components/parameters/BuildId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /builds/{id}/file:
    get:
      operationId: downloadBuildFile
      summary: 下载原始包文件（唯一不套 JSON 的成功响应）
      description: >
        io.Copy 成功完成且写出字节等于 Content-Length 之后才原子 +1 下载次数；
        404、路径非法、文件缺失、客户端中断、copy 出错、字节不足一律不计数。
      parameters:
        - $ref: '#/components/parameters/BuildId'
      responses:
        '200':
          description: 二进制包流
          headers:
            Content-Type:
              schema:
                type: string
              description: Android 为 application/vnd.android.package-archive，iOS 为 application/octet-stream
            Content-Disposition:
              schema:
                type: string
              description: 同时提供 filename 与 RFC 5987 filename*=UTF-8''... 双重编码
            Content-Length:
              schema:
                type: integer
            Cache-Control:
              schema:
                type: string
              example: no-cache
            X-Content-Type-Options:
              schema:
                type: string
              example: nosniff
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /healthz:
    get:
      operationId: health
      summary: 健康检查（独立于 /api/v1，供 compose/systemd 探活）
      description: 该路径挂在根下， servers.url 前缀对它不生效。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        登录接口返回的 token。除 /auth/login、/healthz、/builds/{id}、/builds/{id}/file
        之外的管理接口都要求携带 Authorization: Bearer <token>。
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        外部系统专用。Key 在「系统设置 → 外部 API」查看，由服务端生成，
        与管理员登录态互不影响，只授权 /open/builds。

  parameters:
    PageParam:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始；缺省或非法按 1 处理
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: pageSize
      in: query
      required: false
      description: 每页条数，默认 10、上限 200；显式传 0 表示不分页（返回全量，供下拉选项与聚合使用）
      schema:
        type: integer
        minimum: 0
        maximum: 200
        default: 10
    BuildId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: 包稳定唯一标识

  responses:
    BadRequest:
      description: 缺文件 / 枚举非法 / 平台与文件类型不一致 / 字段超长 / stageToken 失效 / 登录凭据错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 未携带令牌、签名非法或令牌已过期；前端据此清空本地会话并回到登录页
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 包不存在或文件缺失
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: 请求方法不支持
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooLarge:
      description: 超过 200 MB 单包上限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: 写文件 / 写库 / 未预期错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    WebhookField:
      type: string
      description: 可推送到 Webhook 的包字段；展示名见 x-webhook-fields
      enum:
        [id, appName, packageId, version, buildNumber, environment, platform,
         changelog, fileSize, originalFileName, downloadPageUrl, downloadFileUrl,
         downloadCount, createdAt]

    WebhookConfig:
      type: object
      description: >
        Webhook 配置。enabled=true 时 url 必填且必须是 http(s) 绝对地址；
        secret 非空时投递会带 X-Dandelion-Signature: sha256=<HMAC-SHA256(body)>。
      additionalProperties: false
      required: [enabled, url, secret, fields]
      properties:
        enabled:
          type: boolean
        url:
          type: string
          maxLength: 500
        secret:
          type: string
          maxLength: 200
        fields:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WebhookField'

    WebhookFieldOption:
      type: object
      description: 设置页渲染复选框用的字段目录，标签由服务端给出，前端不再抄一份
      required: [key, label]
      properties:
        key:
          $ref: '#/components/schemas/WebhookField'
        label:
          type: string

    Settings:
      type: object
      required: [webhook, apiKey, availableFields]
      properties:
        webhook:
          $ref: '#/components/schemas/WebhookConfig'
        apiKey:
          type: string
          description: 外部上传接口的 Key，只在此接口返回，仅管理员可见
        availableFields:
          type: array
          items:
            $ref: '#/components/schemas/WebhookFieldOption'

    WebhookTestResult:
      type: object
      description: 测试投递结果；目标不可达也是 200，用 delivered=false 表达
      required: [delivered, statusCode, message]
      properties:
        delivered:
          type: boolean
        statusCode:
          type: integer
          description: 目标返回的 HTTP 状态码；未收到响应时为 0
        message:
          type: string

    LoginRequest:
      type: object
      description: 管理员登录请求；mode 省略时按单人模式处理。
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          maxLength: 128
        mode:
          $ref: '#/components/schemas/SessionMode' 

    SessionMode:
      type: string
      description: 登录模式；solo 单人只看自己产生的数据，team 团队看全量平台数据
      enum: [solo, team]
      default: solo

    AccountLevel:
      type: string
      description: >
        管理身份层级，决定「能管谁、管多大范围」，与业务角色正交。
        顺序 super_admin > platform_admin > team_admin > member；
        与 users.account_level 的 CHECK 约束、Go 的 contract.AccountLevel* 常量一一对应。
      enum: [super_admin, platform_admin, team_admin, member]
      default: member

    LoginResult:
      type: object
      description: >
        无状态令牌：载荷含账号、令牌版本、到期时间与登录模式，签名由 AUTH_SECRET 生成。
        服务端不存会话，重启后令牌仍然有效；前端存 localStorage 并随请求发送。
      required: [token, username, expiresAt, mode, accountLevel, tenantId]
      properties:
        token:
          type: string
          description: 形如「账号|版本|到期时间戳|模式.HMAC-SHA256 签名」的 BASE64URL 串
        username:
          type: string
        expiresAt:
          type: string
          format: date-time
          description: ISO 8601 UTC，由 x-constants.authTokenTTLSeconds 推出
        mode:
          $ref: '#/components/schemas/SessionMode'
        accountLevel:
          $ref: '#/components/schemas/AccountLevel'
        tenantId:
          type: string
          description: 账号所属公司 id；超管为空串。仅供首屏展示，服务端判定一律以令牌重建的身份为准

    Environment:
      type: string
      description: 四环境枚举，全仓唯一定义处；DB 只 NOT NULL 不加 CHECK
      enum: [test, hotfix, pre, prd]

    Platform:
      type: string
      description: 平台枚举；label / ext / contentType 见 x-platforms
      enum: [android, ios, harmony]

    PlatformQuery:
      type: string
      description: 平台筛选，省略或 all 表示不筛
      enum: [all, android, ios, harmony]

    Project:
      type: object
      description: 项目是业务数据的一级归属：应用包、应用、热更新都挂在项目下
      required: [id, key, name, description, repoUrl, roleKey, roleName, createdAt]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          description: URL 段，创建后不可修改
        name:
          type: string
        description:
          type: string
        repoUrl:
          type: string
          description: 项目库地址（GitLab / GitHub 等），空串表示未填；详情页渲染为可点击链接
        roleKey:
          type: string
          description: 项目角色标识；为空表示沿用人员自身角色
        roleName:
          type: string
        createdAt:
          type: string
          format: date-time

    ProjectInput:
      type: object
      description: 新建 / 编辑项目请求；编辑时 key 被忽略
      additionalProperties: false
      required: [key, name, description, repoUrl, roleKey]
      properties:
        key:
          type: string
          maxLength: 32
          pattern: '^[a-z0-9][a-z0-9-]{1,31}$'
          description: 小写字母 / 数字 / 短横线，2-32 位，全仓唯一
        name:
          type: string
          maxLength: 60
        description:
          type: string
          maxLength: 200
        repoUrl:
          type: string
          maxLength: 300
          description: http(s) 绝对地址；留空表示未填
        roleKey:
          type: string
          description: 项目角色标识；留空表示沿用人员自身角色

    ProjectDetail:
      type: object
      description: 项目详情 = 项目本身 + 关联的人员与团队（带名字）
      required: [id, key, name, description, repoUrl, roleKey, roleName, createdAt, persons, teams]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        description:
          type: string
        repoUrl:
          type: string
        roleKey:
          type: string
        roleName:
          type: string
        createdAt:
          type: string
          format: date-time
        persons:
          type: array
          items:
            $ref: '#/components/schemas/RelationRef'
        teams:
          type: array
          items:
            $ref: '#/components/schemas/RelationRef'

    RelationRef:
      type: object
      description: 关联的轻量投影（id + 名字）；列表接口直接带回，前端不必再拉对方列表
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string

    Person:
      type: object
      description: 人员；teams / projects 是带名字的多选关联
      required: [id, name, email, phone, title, roleKey, roleName, teams, projects, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        username:
          type: string
          description: 与登录账号对应；空表示只在通讯录里，不能登录
        email:
          type: string
        phone:
          type: string
        title:
          type: string
        roleKey:
          type: string
          description: 该人员的角色标识；空表示未分配
        roleName:
          type: string
        teams:
          type: array
          items:
            $ref: '#/components/schemas/RelationRef'
        projects:
          type: array
          items:
            $ref: '#/components/schemas/RelationRef'
        createdAt:
          type: string
          format: date-time

    PersonInput:
      type: object
      description: 新增 / 编辑人员请求
      additionalProperties: false
      required: [name, username, email, phone, title, roleKey, teamIds, projectIds]
      properties:
        name:
          type: string
          maxLength: 40
        username:
          type: string
          maxLength: 64
        email:
          type: string
          maxLength: 120
        phone:
          type: string
          maxLength: 40
        title:
          type: string
          maxLength: 60
        roleKey:
          type: string
          description: 角色标识；留空表示未分配
        teamIds:
          type: array
          items:
            type: string
        projectIds:
          type: array
          items:
            type: string

    Team:
      type: object
      description: 团队；persons / projects 是带名字的多选关联
      required: [id, name, description, persons, projects, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        persons:
          type: array
          items:
            $ref: '#/components/schemas/RelationRef'
        projects:
          type: array
          items:
            $ref: '#/components/schemas/RelationRef'
        createdAt:
          type: string
          format: date-time

    TeamInput:
      type: object
      description: 新增 / 编辑团队请求
      additionalProperties: false
      required: [name, description, personIds, projectIds]
      properties:
        name:
          type: string
          maxLength: 60
        description:
          type: string
          maxLength: 200
        personIds:
          type: array
          items:
            type: string
        projectIds:
          type: array
          items:
            type: string

    Me:
      type: object
      description: 当前登录人；没有对应人员记录时 personId 为空、projectKeys 为空
      required: [username, personId, name, roleKey, roleName, projectKeys, isSuperAdmin, tenantId, tenantName, accountLevel, teamIds, permissions]
      properties:
        username:
          type: string
        personId:
          type: string
        name:
          type: string
        roleKey:
          type: string
          description: 人员在团队里的角色 key；未分配角色时为空串
        roleName:
          type: string
          description: 角色名；为空表示该人员没有角色，前端统一显示「普通用户」
        projectKeys:
          type: array
          description: 该人员关联的项目 key，按项目创建顺序；前端据此决定列表页默认项目
          items:
            type: string
        isSuperAdmin:
          type: boolean
          description: 是否超级管理员；前端据此决定是否渲染「超级管理员」菜单（真正的边界在服务端 403）
        tenantId:
          type: string
          description: 账号所属公司 id；超管为空串
        tenantName:
          type: string
          description: 公司名，由 tenants 表按 tenantId 查得；超管为空串
        accountLevel:
          $ref: '#/components/schemas/AccountLevel'
        teamIds:
          type: array
          description: 数据范围内的团队 id 并集，由 authz.Service.ScopeOf 推导；超管与公司管理员为空数组表示不限团队
          items:
            type: string
            format: uuid
        permissions:
          type: array
          description: 平台级权限点（不含项目）；项目内权限可能被项目角色覆盖，由各接口判定
          items:
            type: string

    User:
      type: object
      description: 账号视图（不含任何密码字段）
      required: [id, username, mode, personId, personName, roleKey, roleName, isSuperAdmin, status, lastLoginAt, lastLoginIp, createdAt, accountLevel, tenantId, teamIds]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        mode:
          $ref: '#/components/schemas/SessionMode'
        personId:
          type: string
          description: 绑定的人员档案 id，空表示未绑定
        personName:
          type: string
        roleKey:
          type: string
          description: 绑定人员的角色 key；账号本身没有角色，角色挂在人员身上
        roleName:
          type: string
          description: 角色名；为空表示未分配角色，前端显示「普通用户」
        isSuperAdmin:
          type: boolean
        status:
          type: string
          enum: [active, disabled]
        lastLoginAt:
          type: string
          format: date-time
        lastLoginIp:
          type: string
        createdAt:
          type: string
          format: date-time
        accountLevel:
          $ref: '#/components/schemas/AccountLevel'
          description: 管理身份层级，与业务角色正交
        tenantId:
          type: string
          description: 账号归属公司；超管为空
        teamIds:
          type: array
          description: 团队管理员可管的团队 id；其它层级为空数组
          items:
            type: string

    UserInput:
      type: object
      description: >-
        新建账号。没有 mode 字段：账号归属模式由创建者的登录模式决定，
        登录时已选定模式，页面上只做只读展示。
        accountLevel 只能传比调用者低的层级，越权由服务端拒绝；归属公司从调用者推导，不接受请求指定。
      additionalProperties: false
      required: [username, password, personId, isSuperAdmin, accountLevel, teamIds]
      properties:
        username:
          type: string
          maxLength: 32
          pattern: '^[a-zA-Z0-9._-]{3,32}$'
        password:
          type: string
          minLength: 8
          maxLength: 64
        personId:
          type: string
          description: 绑定的人员档案 id，可留空（之后再绑定）
        isSuperAdmin:
          type: boolean
        accountLevel:
          $ref: '#/components/schemas/AccountLevel'
        teamIds:
          type: array
          description: 仅 accountLevel=team_admin 时有意义，且必须落在调用者可见的团队内
          items:
            type: string

    UserUpdate:
      type: object
      description: >-
        编辑账号（登录名与模式都不可改）。roleKey 写的是绑定人员的角色（people.role_key），
        因此「在这里改角色」与「在人员管理里改角色」是同一件事。
      additionalProperties: false
      required: [personId, roleKey, isSuperAdmin]
      properties:
        personId:
          type: string
          description: 绑定的人员档案 id；为空时 roleKey 会被忽略（角色必须挂在人身上）
        roleKey:
          type: string
          description: 绑定人员的角色 key；空串表示不分配角色
        isSuperAdmin:
          type: boolean

    TenantInput:
      type: object
      description: 新建公司及其平台管理员；两者原子创建，明文密码只在响应里返回一次
      additionalProperties: false
      required: [name, code, adminUsername, adminPassword]
      properties:
        name:
          type: string
          description: 公司名称
        code:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,31}$'
          description: 公司标识，小写字母/数字/短横线
        adminUsername:
          type: string
          pattern: '^[a-zA-Z0-9._-]{3,32}$'
          description: 平台管理员账号名
        adminPassword:
          type: string
          minLength: 8
          maxLength: 64
          description: 平台管理员初始密码

    Tenant:
      type: object
      description: 公司视图（含其平台管理员账号名）
      required: [id, name, code, status, adminUsername, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
        status:
          type: string
          enum: [active, disabled]
        adminUsername:
          type: string
        createdAt:
          type: string
          format: date-time

    TenantResult:
      type: object
      description: 新建公司的结果；password 是平台管理员的一次性明文密码
      required: [tenant, password]
      properties:
        tenant:
          $ref: '#/components/schemas/Tenant'
        password:
          type: string

    TenantListResponse:
      type: object
      description: 统一响应外壳，data 为公司分页列表
      required: [code, data, message]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: object
          required: [items, page, pageSize, total]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Tenant'
            page:
              type: integer
            pageSize:
              type: integer
            total:
              type: integer

    TenantCreateResponse:
      type: object
      description: 统一响应外壳，data 为新建公司结果
      required: [code, data, message]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/TenantResult'



    Permission:
      type: object
      required: [key, group, label]
      properties:
        key:
          type: string
        group:
          type: string
          description: 权限点所属模块，前端按它分组渲染
        label:
          type: string

    Role:
      type: object
      required: [id, key, name, description, isBuiltin, permissions, createdAt]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        description:
          type: string
        isBuiltin:
          type: boolean
          description: 内置角色不可删除；超管角色的权限不可修改
        permissions:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    RoleInput:
      type: object
      description: 新建 / 编辑角色；编辑时 key 被忽略
      additionalProperties: false
      required: [key, name, description, permissions]
      properties:
        key:
          type: string
          maxLength: 32
          pattern: '^[a-z][a-z0-9-]{1,31}$'
        name:
          type: string
          maxLength: 40
        description:
          type: string
          maxLength: 200
        permissions:
          type: array
          items:
            type: string

    PermissionListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/Permission'

    RoleResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/Role'

    RoleListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/Role'

    ApiKeyResult:
      type: object
      description: 轮换后的新 Key，明文只在本响应出现一次
      required: [apiKey]
      properties:
        apiKey:
          type: string

    AuditLog:
      type: object
      description: >
        一条审计记录；detail 是 JSON 文本，由写入方决定结构。
        mode 标出这条日志产生于哪个模式的分区——单人、团队各写各的表，
        跨模式互不可见，因此它是记录本身的属性而非筛选条件。
      required: [id, createdAt, mode, actorId, actorName, action, objectType, objectId, result, detail, ip]
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        mode:
          $ref: '#/components/schemas/SessionMode'
        actorId:
          type: string
        actorName:
          type: string
        action:
          type: string
        objectType:
          type: string
        objectId:
          type: string
        result:
          type: string
          enum: [success, failure]
        detail:
          type: string
        ip:
          type: string

    UserStatusInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [active, disabled]

    PasswordReset:
      type: object
      description: 一次性临时密码，只在该响应里出现一次
      required: [password]
      properties:
        password:
          type: string

    PasswordChange:
      type: object
      description: >
        修改自己的密码。oldPassword 必填：持有有效令牌不等于本人操作，
        校验旧密码才能挡住"手机被人拿起就改密码"的情况。
      additionalProperties: false
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
          description: 当前密码，用于确认操作者是本人
        newPassword:
          type: string
          description: 新密码，8-64 位，且不得与当前密码相同


    MetaSource:
      type: string
      description: >
        服务端派生的元数据来源内部标注：任一字段发生空值兜底 → fallback，否则 → parsed。
        不出现在 CommitBuildRequest 中，前端无法伪造、也不参与请求校验。
      enum: [parsed, fallback]

    ParsedMeta:
      type: object
      description: 自动解析的 4 个规范字段（Android / iOS 各 4 个原字段统一映射到这里）
      required: [appName, packageId, version, buildNumber]
      properties:
        appName:
          type: string
          description: Android Application.Label / iOS CFBundleDisplayName（缺失回退 CFBundleName）
        packageId:
          type: string
          description: Android Manifest.Package / iOS CFBundleIdentifier
        version:
          type: string
          description: Android versionName / iOS CFBundleShortVersionString
        buildNumber:
          type: string
          description: Android versionCode / iOS CFBundleVersion

    StageResult:
      type: object
      required: [stageToken, parsed, warnings]
      properties:
        stageToken:
          type: string
          format: uuid
          description: 暂存文件标识，1 小时有效，rename 后立即失效
        parsed:
          $ref: '#/components/schemas/ParsedMeta'
        warnings:
          type: array
          items:
            type: string
          description: 解析失败 / 损坏 / 超时的中文原因，不阻塞上传

    CommitBuildRequest:
      type: object
      description: >
        提交发布请求，application/json，**恰好 9 个字段**：项目 + token + 表单最终值。
        绝不包含 file 字段，也不携带解析结果、touched 标记或 metaSource（来源由服务端派生）。
      additionalProperties: false
      required: [project, stageToken, environment, platform]
      properties:
        project:
          type: string
          description: 项目 key；包归属于该项目
        stageToken:
          type: string
          format: uuid
        environment:
          $ref: '#/components/schemas/Environment'
        platform:
          $ref: '#/components/schemas/Platform'
        appName:
          type: string
          maxLength: 100
        packageId:
          type: string
          maxLength: 100
        version:
          type: string
          maxLength: 50
        buildNumber:
          type: string
          maxLength: 50
        changelog:
          type: string
          maxLength: 2000

    Build:
      type: object
      description: 完整包 DTO；三个 URL 字段由服务端 buildURLs(id) 派生，不入库
      required:
        - id
        - environment
        - platform
        - appName
        - packageId
        - version
        - buildNumber
        - changelog
        - originalFileName
        - fileSize
        - fileExt
        - relativePath
        - metaSource
        - downloadCount
        - downloadPagePath
        - downloadPageUrl
        - downloadFileUrl
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        environment:
          $ref: '#/components/schemas/Environment'
        platform:
          $ref: '#/components/schemas/Platform'
        appName:
          type: string
        packageId:
          type: string
        version:
          type: string
        buildNumber:
          type: string
        changelog:
          type: string
        originalFileName:
          type: string
          description: 已清洗的原始文件名，仅用于展示与下载名
        fileSize:
          type: integer
          format: int64
        fileExt:
          type: string
          enum: [apk, ipa]
        relativePath:
          type: string
          description: 相对 uploads 根目录的规范化路径
        metaSource:
          $ref: '#/components/schemas/MetaSource'
        downloadCount:
          type: integer
          format: int64
          description: 下载成功后才原子自增；起点 0、只增不减
        downloadPagePath:
          type: string
          description: 相对路径 /d/{id}；唯一用途是前端 react-router 内部跳转，严禁用于二维码 / 复制 / 下载
        downloadPageUrl:
          type: string
          format: uri
          description: 绝对地址，二维码内容与复制按钮的唯一来源
        downloadFileUrl:
          type: string
          format: uri
          description: 绝对地址，下载按钮的唯一来源
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 UTC
        ownerUserId:
          type: string
          description: 上传者账号 id；system 表示外部 API 或历史数据

    ListBuildsResult:
      type: object
      required: [items, total, environment, platform]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Build'
        total:
          type: integer
        environment:
          $ref: '#/components/schemas/Environment'
        platform:
          type: string
          description: 实际生效的平台筛选，未筛选时为 all

    HealthStatus:
      type: object
      required: [status, uptime, dbOk, storageWritable]
      properties:
        status:
