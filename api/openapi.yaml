          description: 进程运行秒数
        dbOk:
          type: boolean
        storageWritable:
          type: boolean

    ApiResponse:
      type: object
      description: 统一响应外壳；成功 code=0，失败 code=HTTP 状态码且 data=null
      required: [code, data, message]
      properties:
        code:
