    ReviewDetailResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/ReviewDetail'

    # ── AI 人机交互层 · 枚举 ──────────────────────────────────────
    ReviewDecision: {type: string, enum: [pending, accepted, rejected]}
    InteractionFileStatus: {type: string, enum: [added, modified, deleted, renamed]}
    InteractionSource: {type: string, enum: [agent_executor]}
    SubmitStatus: {type: string, enum: [pending, submitted]}
    QuestionType: {type: string, enum: [single, multiple, text]}
    GateStatus: {type: string, enum: [blocked, confirmed]}
    CheckpointStatus: {type: string, enum: [active, rolled_back, partially_rolled_back]}
    RiskLevel: {type: string, enum: [low, medium, high]}
    Intervention: {type: string, enum: [exempt, sample, strict]}
    OperationType: {type: string, enum: [delete_file, config_change, dependency_change, schema_migration, permission_change, api_change, model_change, code_edit, format, comment, doc, add_test, style, add_file, other]}
    RollbackScope: {type: string, enum: [hunk, file, checkpoint]}
    ApprovalDecision: {type: string, enum: [approve, reject]}

    # ── AI 人机交互层 · 产物结构（来自 AgentArtifactProvider，不可变快照）──
    Hunk:
      type: object
      description: 单个 diff 块；oldStart/newStart 均 1-based，上下文为独立字段仅中栏展示
      required: [hunkId, oldStart, oldLines, newStart, newLines, oldContent, newContent, contextBefore, contextAfter, riskLabel]
      properties:
        hunkId: {type: string, maxLength: 128}
        oldStart: {type: integer, minimum: 1}
        oldLines: {type: integer, minimum: 0}
        newStart: {type: integer, minimum: 1}
        newLines: {type: integer, minimum: 0}
        oldContent: {type: array, items: {type: string}}
        newContent: {type: array, items: {type: string}}
        contextBefore: {type: array, items: {type: string}}
        contextAfter: {type: array, items: {type: string}}
        riskLabel: {$ref: '#/components/schemas/OperationType'}
    FileDiff:
      type: object
      required: [filePath, fileStatus, oldPath, hunks]
      properties:
        filePath: {type: string, maxLength: 500, description: 仓库相对路径，已脱敏}
        fileStatus: {$ref: '#/components/schemas/InteractionFileStatus'}
        oldPath: {type: string, maxLength: 500, description: 仅 renamed 时有值}
        hunks: {type: array, maxItems: 2000, items: {$ref: '#/components/schemas/Hunk'}}
    HunkDecision:
      type: object
      required: [reviewId, hunkId, decision, decidedBy, decidedAt]
      properties:
        reviewId: {type: string, format: uuid}
        hunkId: {type: string, maxLength: 128}
        decision: {$ref: '#/components/schemas/ReviewDecision'}
        decidedBy: {type: string}
        decidedAt: {type: string}
    HunkDecisionInput:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: {$ref: '#/components/schemas/ReviewDecision'}

    # ── Diff 审查 ────────────────────────────────────────────────
    DiffReview:
      type: object
      required: [id, taskId, subtaskId, checkpointId, source, submitStatus, files, decisions, createdAt]
      properties:
        id: {type: string, format: uuid}
        taskId: {type: string, format: uuid}
        subtaskId: {type: string, format: uuid}
        checkpointId: {type: string}
        source: {$ref: '#/components/schemas/InteractionSource'}
        submitStatus: {$ref: '#/components/schemas/SubmitStatus'}
        files: {type: array, items: {$ref: '#/components/schemas/FileDiff'}}
        decisions: {type: array, items: {$ref: '#/components/schemas/HunkDecision'}}
        createdAt: {type: string, format: date-time}
    DiffReviewInput:
      type: object
      additionalProperties: false
      required: [decisions]
      properties:
        decisions: {type: array, items: {$ref: '#/components/schemas/HunkDecision'}}
    DiffReviewResponse:
      allOf:
        - {$ref: '#/components/schemas/ApiResponse'}
        - type: object
          properties:
            data:
              anyOf:
                - {$ref: '#/components/schemas/DiffReview'}
                - {type: 'null'}

    # ── 计划确认 ────────────────────────────────────────────────
    QuestionOption:
      type: object
      additionalProperties: false
      required: [optionId, label]
      properties:
        optionId: {type: string}
        label: {type: string}
    Question:
      type: object
      additionalProperties: false
      required: [questionId, prompt, type, required, options]
      properties:
        questionId: {type: string}
        prompt: {type: string}
        type: {$ref: '#/components/schemas/QuestionType'}
        required: {type: boolean}
        options: {type: array, items: {$ref: '#/components/schemas/QuestionOption'}}
        answer: {}
    PlanTask:
      type: object
      additionalProperties: false
      required: [stepId, title, description, confirmed, estimatedRisk]
      properties:
        stepId: {type: string}
        title: {type: string}
        description: {type: string}
        confirmed: {type: boolean}
        estimatedRisk: {$ref: '#/components/schemas/RiskLevel'}
    PlanConfirmation:
      type: object
      required: [id, taskId, subtaskId, questionnaire, planTasks, gateStatus, confirmedBy, confirmedAt]
      properties:
        id: {type: string, format: uuid}
        taskId: {type: string, format: uuid}
        subtaskId: {type: string, format: uuid}
        questionnaire: {type: array, items: {$ref: '#/components/schemas/Question'}}
        planTasks: {type: array, items: {$ref: '#/components/schemas/PlanTask'}}
        gateStatus: {$ref: '#/components/schemas/GateStatus'}
        confirmedBy: {type: string}
        confirmedAt: {type: string}
    PlanConfirmInput:
      type: object
      additionalProperties: false
      required: [answers, stepIds]
      properties:
        answers: {type: array, items: {$ref: '#/components/schemas/Question'}}
        stepIds: {type: array, items: {type: string}}
    PlanConfirmationResponse:
      allOf:
        - {$ref: '#/components/schemas/ApiResponse'}
        - type: object
          properties:
            data:
              anyOf:
                - {$ref: '#/components/schemas/PlanConfirmation'}
                - {type: 'null'}

    # ── 检查点回滚 ──────────────────────────────────────────────
    FileSnapshot:
      type: object
      required: [filePath, fileStatus, beforeContent, afterContent, beforeHash, afterHash]
      properties:
        filePath: {type: string, maxLength: 500}
        fileStatus: {$ref: '#/components/schemas/InteractionFileStatus'}
        beforeContent: {type: string}
        afterContent: {type: string}
        beforeHash: {type: string, maxLength: 128}
        afterHash: {type: string, maxLength: 128}
    Checkpoint:
      type: object
      required: [id, taskId, subtaskId, aiAction, files, rollbackToken, status, createdBy, createdAt]
      properties:
        id: {type: string, format: uuid}
        taskId: {type: string, format: uuid}
        subtaskId: {type: string, format: uuid}
        aiAction: {type: string, maxLength: 200}
        files: {type: array, items: {$ref: '#/components/schemas/FileSnapshot'}}
        rollbackToken: {type: string}
        status: {$ref: '#/components/schemas/CheckpointStatus'}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
    RollbackTarget:
      type: object
      additionalProperties: false
      required: [filePath, hunkId]
      properties:
        filePath: {type: string, maxLength: 500}
        hunkId: {type: string, maxLength: 128}
    RollbackInput:
      type: object
      additionalProperties: false
      required: [rollbackToken, scope, targets, currentHashes]
      properties:
        rollbackToken: {type: string}
        scope: {$ref: '#/components/schemas/RollbackScope'}
        targets: {type: array, items: {$ref: '#/components/schemas/RollbackTarget'}}
        currentHashes: {type: object, additionalProperties: {type: string}}
    CheckpointResponse:
      allOf:
        - {$ref: '#/components/schemas/ApiResponse'}
        - type: object
          properties:
            data:
              anyOf:
                - {$ref: '#/components/schemas/Checkpoint'}
                - {type: 'null'}
    CheckpointListResponse:
      allOf:
        - {$ref: '#/components/schemas/ApiResponse'}
        - type: object
          properties:
            data: {type: array, items: {$ref: '#/components/schemas/Checkpoint'}}

    # ── 分级审批 ────────────────────────────────────────────────
    ApprovalView:
      type: object
      required: [overallRisk, intervention, decided, decision]
      properties:
        overallRisk: {$ref: '#/components/schemas/RiskLevel'}
        intervention: {$ref: '#/components/schemas/Intervention'}
        decided: {type: boolean}
        decision: {$ref: '#/components/schemas/ApprovalDecision'}
    ApprovalDecideInput:
      type: object
      additionalProperties: false
      required: [checkpointId, decision]
      properties:
        checkpointId: {type: string, format: uuid}
        decision: {$ref: '#/components/schemas/ApprovalDecision'}
    ApprovalResponse:
      allOf:
        - {$ref: '#/components/schemas/ApiResponse'}
        - type: object
          properties:
            data:
              anyOf:
                - {$ref: '#/components/schemas/ApprovalView'}
                - {type: 'null'}

    # ── 第 5 菜单「AI模型」：响应 schema 刻意没有完整 Key 字段 ──────────────
    AIProvider:
      type: string
      enum: [scnet]
    AIProtocol:
      type: string
      description: 三种上游报文协议；差异只收在各 protocol_xxx.go 的 build/parse 两处。
      enum: [openai, anthropic, openai_responses]
    AIReasoningEffort:
      type: string
      enum: [none, low, high, max]
    AICapability:
      type: string
      enum: [文本生成, 深度思考, 视觉理解]
    AITestCategory:
      type: string
      description: 七类错误分类；ok 仅用于成功结果（不是错误类别）。
      enum: [ok, config_missing, auth_failed, parameter_error, rate_limited, network_error, response_error, capability_mismatch]
    AIExtraConfig:
      type: object
      description: 首版四个具体字段；写入时未知键 400，读取时忽略未知键并补默认值。
      additionalProperties: false
      properties:
        temperature: {type: number, minimum: 0, maximum: 2, default: 1}
        topP: {type: number, exclusiveMinimum: true, minimum: 0, maximum: 1, default: 1}
        reasoningEffort: {$ref: '#/components/schemas/AIReasoningEffort'}
        timeoutMs: {type: integer, minimum: 1000, maximum: 120000, default: 30000}
    AIModel:
      type: object
      description: 模型配置投影；apiKeyMask 是唯一可回显的 Key 相关信息。
      additionalProperties: false
      required: [id, name, provider, protocol, baseUrl, modelId, apiKeyMask, isDefault, thinkingEnabled, contextTokens, extraConfig, capabilities, enabled, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, maxLength: 100}
        provider: {$ref: '#/components/schemas/AIProvider'}
        protocol: {$ref: '#/components/schemas/AIProtocol'}
        baseUrl: {type: string, maxLength: 500}
        modelId: {type: string, maxLength: 100}
        apiKeyMask: {type: string, description: 仅末 4 位掩码，例如 sk-****wxyz}
        isDefault: {type: boolean}
        thinkingEnabled: {type: boolean}
        contextTokens: {type: integer, minimum: 1024, maximum: 393216}
        extraConfig: {$ref: '#/components/schemas/AIExtraConfig'}
        capabilities: {type: array, maxItems: 16, items: {$ref: '#/components/schemas/AICapability'}}
        enabled: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    AIModelInput:
      type: object
      description: 新建 / 编辑请求体；apiKey 留空=不更新；无 tenantId / isDefault / enabled / apiKeyMask。
      additionalProperties: false
      required: [name, provider, protocol, baseUrl, modelId, thinkingEnabled, contextTokens, extraConfig, capabilities]
      properties:
        name: {type: string, maxLength: 100}
        provider: {$ref: '#/components/schemas/AIProvider'}
        protocol: {$ref: '#/components/schemas/AIProtocol'}
        baseUrl: {type: string, maxLength: 500}
        modelId: {type: string, maxLength: 100}
        apiKey: {type: string, description: 明文仅入站；留空表示不更新}
        thinkingEnabled: {type: boolean}
        contextTokens: {type: integer, minimum: 1024, maximum: 393216, default: 8192}
        extraConfig: {$ref: '#/components/schemas/AIExtraConfig'}
        capabilities: {type: array, maxItems: 16, items: {$ref: '#/components/schemas/AICapability'}}
    AIModelStatusInput:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: {type: boolean}
    AIModelTestResult:
      type: object
      description: 实测结果摘要；请求 / 响应预览均经 Redact，无 Key、密文与上游原文。
      additionalProperties: false
      required: [ok, category, message, statusCode, latencyMs, modelId, usedFallback, requestSummary, responsePreview, promptTokens, completionTokens]
      properties:
        ok: {type: boolean}
        category: {$ref: '#/components/schemas/AITestCategory'}
        message: {type: string}
        statusCode: {type: integer}
        latencyMs: {type: integer, format: int64}
        modelId: {type: string}
        usedFallback: {type: boolean}
        requestSummary: {type: string}
        responsePreview: {type: string}
        promptTokens: {type: integer}
        completionTokens: {type: integer}
    AIModelResponse:
      allOf:
        - {$ref: '#/components/schemas/ApiResponse'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/AIModel'}
    AIModelListResponse:
      allOf:
        - {$ref: '#/components/schemas/ApiResponse'}
        - type: object
          properties:
            data:
              type: object
              required: [items, total, page, pageSize]
              properties:
                items: {type: array, items: {$ref: '#/components/schemas/AIModel'}}
                total: {type: integer}
                page: {type: integer}
                pageSize: {type: integer}
    AIModelTestResultResponse:
      allOf:
        - {$ref: '#/components/schemas/ApiResponse'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/AIModelTestResult'}

    # ── 第 5 菜单 P1：统计与软限流 ─────────────────────────────────────────
    AIQuotaAction:
      type: string
      description: 超阈值时的动作：warn 只告警照常调用，reject 拒绝且上游零请求。
      enum: [warn, reject]
    AIQuotaConfig:
      type: object
      description: 阈值读取投影；无配置行时补默认值，不返回零值。
      additionalProperties: false
      required: [enabled, maxCalls, windowMinutes, action, updatedAt]
      properties:
        enabled: {type: boolean, default: false}
        maxCalls: {type: integer, minimum: 1, maximum: 1000000, default: 1000}
        windowMinutes: {type: integer, minimum: 1, maximum: 10080, default: 60}
        action: {$ref: '#/components/schemas/AIQuotaAction'}
        updatedAt:
          type: string
          description: 从未配置过时为空串（表示"用的默认值"，不是"刚刚更新"）
    AIQuotaInput:
      type: object
      description: 整行覆盖请求体；无 tenantId（超管用 ?tenantId=）。
      additionalProperties: false
      required: [enabled, maxCalls, windowMinutes, action]
      properties:
        enabled: {type: boolean}
        maxCalls: {type: integer, minimum: 1, maximum: 1000000}
        windowMinutes: {type: integer, minimum: 1, maximum: 10080}
        action: {$ref: '#/components/schemas/AIQuotaAction'}
    AIQuotaResponse:
      allOf:
        - {$ref: '#/components/schemas/ApiResponse'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/AIQuotaConfig'}
    AIModelCallGroup:
      type: object
      description: 分组明细；维度由请求的 groupBy 决定，未选中的维度为空串。
      additionalProperties: false
      required: [modelId, modelName, protocol, scene, day, totalCalls, successCalls, failedCalls, promptTokens, completionTokens, avgSuccessLatencyMs]
      properties:
        modelId: {type: string}
        modelName: {type: string}
        protocol: {type: string}
        scene: {type: string}
        day: {type: string, description: 分组维度含 day 时为 YYYY-MM-DD，否则空串}
        totalCalls: {type: integer}
        successCalls: {type: integer}
        failedCalls: {type: integer}
        promptTokens: {type: integer, format: int64, description: 缺数据为 null（不是 0）}
        completionTokens: {type: integer, format: int64}
        avgSuccessLatencyMs: {type: integer, format: int64, description: 仅成功且已出站；无数据为 null}
    AIModelCallStats:
      type: object
      description: 统计总量 + 分组明细；口径见设计 §4.4（平均耗时只算成功且已出站）。
      additionalProperties: false
      required: [totalCalls, successCalls, failedCalls, localRejected, promptTokens, completionTokens, tokensUnreported, avgSuccessLatencyMs, failureCategories, groups, quota, quotaState]
      properties:
        totalCalls: {type: integer}
        successCalls: {type: integer}
        failedCalls: {type: integer}
        localRejected: {type: integer, description: 未出站条数；默认口径已排除，includeLocal=true 时单列}
        promptTokens: {type: integer, format: int64, description: null 表示没有任何上报 usage 的记录}
        completionTokens: {type: integer, format: int64}
        tokensUnreported: {type: integer, description: tokens_reported=false 的条数}
        avgSuccessLatencyMs: {type: integer, format: int64}
        failureCategories:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [category, count]
            properties:
              category: {$ref: '#/components/schemas/AITestCategory'}
              count: {type: integer}
        groups: {type: array, items: {$ref: '#/components/schemas/AIModelCallGroup'}}
        quota: {$ref: '#/components/schemas/AIQuotaConfig'}
        quotaState:
          type: string
          description: ok 未超阈值；exceeded 已达上限（warn 模式下前端提示条）
          enum: [ok, exceeded]
    AIModelUsageResponse:
      allOf:
        - {$ref: '#/components/schemas/ApiResponse'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/AIModelCallStats'}
