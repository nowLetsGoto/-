# deploy/nginx.conf · 容器阶段反向代理与静态直出。
# 职责：/api/ 反代到 Go 服务、静态资源直出、SPA fallback、放行 200MB 上传。
# 输入：对外 HTTP(S) 请求；输出：代理响应或本地静态文件。
# 边界：proxy_set_header 只用于日志/链路追踪，服务端拼绝对地址从不读 Host / X-Forwarded-*；
#       谁托管静态谁负责 /d/:id 回 index.html —— 单机 Go 与这里两处都写了 fallback。

server {
    listen 80;
    server_name _;

    # 必须大于单包上限 200MB，否则大包会在 Nginx 层被 413 拦截。
    client_max_body_size 210m;

    # HTTPS 终止位：生产请把 80 端口改成 `return 301 https://$host$request_uri;`，
    # 另起一个 listen 443 ssl 的 server，证书挂载在 /etc/nginx/certs/。

    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    location = /healthz {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    # 第一版静态由本 Nginx 直出；未命中一律回 index.html，保证 /d/{id} 刷新不 404。
    # 未来若要把静态完全交给 Nginx 而 Go 不再托管，只需保留本段并把 Go 的 embed 去掉；
    # 若要把 /assets/ 单独摘出走 CDN，新增 `location /assets/ { ... }` 并开启长缓存即可。
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
